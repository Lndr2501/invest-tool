<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invest-Ratgeber</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b43c4'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/style.css?v=5">
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js?v=5"></script>
<script src="/static/pages.js?v=6"></script>
<script src="/static/calc.js?v=5"></script>
<script src="/static/charts.js?v=5"></script>
<script src="/static/chat.js?v=5"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

<!-- ================= Anmeldung ================= -->
<template x-if="ready && !me">
<main class="login-wrap">
  <div class="row" style="gap:10px;margin-bottom:22px">
    <div class="brand-mark" style="width:40px;height:40px;font-size:22px">↗</div>
    <div><h1 style="margin:0">Invest-Ratgeber</h1><div class="muted">Geld verstehen, planen und anlegen, in einfachen Worten</div></div>
  </div>
  <div class="card" x-show="!login.creating">
    <h2>Wer bist du?</h2>
    <p class="ink2">Jedes Profil hat eigene Ziele, einen eigenen Bestand und einen eigenen Telegram-Bericht.</p>
    <div class="profiles">
      <template x-for="p in profiles" :key="p.id">
        <button @click="pickProfile(p)" :class="login.sel && login.sel.id === p.id ? 'sel' : ''">
          <span class="avatar" x-text="initials(p.name)"></span>
          <span x-text="p.name"></span>
          <small x-show="p.has_pin">🔒 mit PIN</small>
        </button>
      </template>
      <button @click="login.creating = true; login.err = ''"><span class="avatar">+</span><span>Neues Profil</span></button>
    </div>
    <template x-if="login.sel && login.sel.has_pin">
      <form class="row" style="margin-top:16px" @submit.prevent="doLogin()">
        <input type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" x-model="login.pin" style="max-width:180px" x-ref="pin">
        <button class="primary" type="submit">Öffnen</button>
      </form>
    </template>
    <div class="err" style="margin-top:12px" x-show="login.err" x-text="login.err"></div>
  </div>
  <div class="card" x-show="login.creating">
    <h2>Neues Profil</h2>
    <form @submit.prevent="createProfile()">
      <label class="f"><span class="t">Name</span><input x-model="login.name" maxlength="30" placeholder="z. B. Alex" required></label>
      <label class="f"><span class="t">Währung</span>
        <select x-model="login.currency"><template x-for="(c, k) in meta.currencies" :key="k"><option :value="k" x-text="k + ' – ' + c.name"></option></template></select></label>
      <label class="f"><span class="t">PIN (freiwillig)</span>
        <input type="password" inputmode="numeric" autocomplete="new-password" x-model="login.newpin" placeholder="4–12 Ziffern, leer = ohne PIN">
        <div class="hint">Ohne PIN kann jeder im Heimnetz dein Profil öffnen.</div></label>
      <div class="err" style="margin-bottom:12px" x-show="login.err" x-text="login.err"></div>
      <div class="row"><button class="primary" type="submit">Profil anlegen</button><button type="button" class="ghost" @click="login.creating = false">Zurück</button></div>
    </form>
  </div>
  <p class="muted" style="margin-top:18px;font-size:.85rem">Keine Anlageberatung. Alle Prognosen sind Spannen aus der Vergangenheit, keine Garantie.</p>
</main>
</template>

<!-- ================= App ================= -->
<template x-if="ready && me">
<div>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/ueberblick"><span class="brand-mark">↗</span><span>Invest-Ratgeber</span></a>
    <nav class="main">
      <template x-for="n in nav" :key="n[0]"><a :href="'#/' + n[0]" :class="navOn(n[0]) && 'on'" x-text="n[1]"></a></template>
    </nav>
    <div class="who">
      <span class="avatar" x-text="initials(me.name)"></span><span class="name" x-text="me.name"></span>
      <button class="small ghost" @click="logout()" title="Profil wechseln">Wechseln</button>
    </div>
  </div>
</header>

<main>
<!-- ---------- Überblick ---------- -->
<section x-show="route === 'ueberblick'">
  <template x-if="ov">
  <div>
    <div class="page-head">
      <h1 x-text="'Hallo ' + me.name"></h1>
      <p class="lead" x-text="ov.headline.join(' ')"></p>
    </div>

    <div class="ov-top" :class="!ovNext().length && 'single'">
      <div class="card money-card">
        <template x-if="!ov.portfolio.empty">
          <div>
            <div class="label">Dein Bestand heute</div>
            <div class="big" x-text="money(ov.portfolio.total)"></div>
            <p class="ink2" style="margin:8px 0 0">
              <span x-show="ov.portfolio.change['7d']">In 7 Tagen <b :class="cls(ov.portfolio.change['7d'] && ov.portfolio.change['7d'].pct) + '-t'" x-text="pct(ov.portfolio.change['7d'] && ov.portfolio.change['7d'].pct)"></b>.</span>
              <span x-show="ov.portfolio.gain !== null"> Seit dem Kauf <b :class="cls(ov.portfolio.gain) + '-t'" x-text="signMoney(ov.portfolio.gain)"></b>.</span>
            </p>
            <div style="margin-top:14px">
              <div class="alloc-bar"><template x-for="a in ov.portfolio.alloc" :key="a.asset"><div :style="'width:' + (a.share * 100) + '%;background:' + col(a.asset)" :title="a.name"></div></template></div>
              <div class="legend" style="margin-top:8px"><template x-for="a in ov.portfolio.alloc.slice(0, 5)" :key="a.asset"><span><i class="dot" :style="'background:' + col(a.asset)"></i><span x-text="a.name + ' ' + num(a.share * 100, 0) + ' %'"></span></span></template></div>
            </div>
            <a class="more" href="#/bestand">Zum Bestand →</a>
          </div>
        </template>
        <template x-if="ov.portfolio.empty">
          <div>
            <div class="label">Dein Bestand</div>
            <div class="mid" style="margin:4px 0 8px">Du hast noch nichts angelegt</div>
            <p class="ink2">Kein Problem. Die meisten fangen mit einer kleinen Sparrate an. In 5 kurzen Fragen bekommst du einen ersten Plan.</p>
            <div class="row"><a class="btn primary" href="#/start">Plan in 5 Fragen</a><a class="btn" href="#/bestand?add=1">Ich habe schon etwas</a></div>
          </div>
        </template>
      </div>

      <template x-if="ovNext().length">
        <div class="card next-card">
          <div class="label">Dein nächster Schritt</div>
          <h3 x-text="ovNext()[0].title"></h3>
          <p x-text="ovNext()[0].text"></p>
          <a class="btn primary" :href="ovNext()[0].link" x-text="ovNext()[0].action"></a>
          <details class="more-ideas" x-show="ovNext().length > 1">
            <summary x-text="'Weitere Ideen (' + (ovNext().length - 1) + ')'"></summary>
            <template x-for="n in ovNext().slice(1)" :key="n.title"><a class="idea" :href="n.link"><b x-text="n.title"></b><span x-text="n.text"></span></a></template>
          </details>
        </div>
      </template>
    </div>

    <template x-if="ov.goal">
      <div class="card goal-card section">
        <div class="row between"><div class="label">Dein Ziel</div>
          <span class="chip" :class="ov.goal.on_track === true ? 'up' : ov.goal.on_track === false ? 'down' : ''" x-text="ov.goal.on_track === true ? 'auf Kurs' : ov.goal.on_track === false ? 'noch nicht auf Kurs' : 'Sparrate fehlt'"></span></div>
        <p style="margin:6px 0 0" x-text="ov.goal.text"></p>
        <a class="more" href="#/ziele" x-text="ov.goal.count > 1 ? 'Alle ' + ov.goal.count + ' Ziele →' : 'Ziel ansehen →'"></a>
      </div>
    </template>

    <div class="section">
      <div class="row between"><h2 style="margin:0">Deine Märkte</h2><a href="#/maerkte">Alle Märkte →</a></div>
      <p class="muted" style="font-size:.9rem;margin:4px 0 10px">Preise in deiner Einheit. Die Zahl rechts ist die Veränderung der letzten 7 Tage.</p>
      <div class="card list">
        <template x-for="m in ov.markets" :key="m.asset">
          <a class="mrow" :href="'#/maerkte/' + m.asset">
            <i class="dot" :style="'background:' + col(m.asset)"></i>
            <div class="mrow-main"><b x-text="m.short"></b><small x-text="m.line"></small></div>
            <div class="mrow-price"><b x-text="m.text"></b><small x-text="m.label"></small></div>
            <div class="mrow-ch"><span class="chip" :class="cls(m.change['7d'])" x-text="pct(m.change['7d'])"></span></div>
          </a>
        </template>
        <div class="muted" x-show="!ov.markets.length" style="padding:10px 0">Du beobachtest noch keine Märkte. <a href="#/maerkte">Märkte auswählen →</a></div>
      </div>
    </div>

    <div class="section card ask-card" x-show="aiVisible()">
      <h3>Frag den Ratgeber</h3>
      <p class="ink2" style="font-size:.93rem">Der KI-Ratgeber kennt deinen Bestand, deine Ziele und alle Rechner, und erklärt alles ohne Fachchinesisch.</p>
      <div class="chips"><template x-for="q in askChips.ueberblick" :key="q"><button class="small" @click="ask(q)" x-text="q"></button></template></div>
    </div>
  </div>
  </template>
</section>

<!-- ---------- Start-Assistent ---------- -->
<section x-show="route === 'start'">
  <div class="wizard">
    <div class="page-head"><h1>Dein erster Plan</h1><p>Fünf kurze Fragen. Danach weißt du, in welcher Reihenfolge du vorgehst, wie viel im Monat sinnvoll ist und was daraus werden kann.</p></div>
    <div class="steps-dots" x-show="wz.step <= 5"><template x-for="i in 5" :key="i"><i :class="i < wz.step ? 'done' : i === wz.step ? 'on' : ''"></i></template><span x-text="'Frage ' + wz.step + ' von 5'"></span></div>

    <div class="card" x-show="wz.step === 1">
      <h2>Wofür möchtest du sparen?</h2>
      <div class="pick">
        <template x-for="p in purposeList()" :key="p[0]"><button :class="wz.a.purpose === p[0] && 'sel'" @click="wz.a.purpose = p[0]; wz.a.name = wz.a.name || p[2]"><span class="ic" x-text="p[3]"></span><span x-text="p[1]"></span></button></template>
      </div>
      <label class="f" style="margin-top:14px"><span class="t">Name für dein Ziel (freiwillig)</span><input x-model="wz.a.name" maxlength="60" placeholder="z. B. Neues Auto"></label>
      <div class="row end"><button class="primary" :disabled="!wz.a.purpose" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 2">
      <h2>Wann brauchst du das Geld?</h2>
      <p class="ink2">Das ist die wichtigste Frage: Je länger das Geld liegen kann, desto eher darf es zwischendurch schwanken.</p>
      <div class="pick">
        <template x-for="h in horizons" :key="h[0]"><button :class="wz.a.years === h[0] && 'sel'" @click="wz.a.years = h[0]"><b x-text="h[1]"></b><small x-text="h[2]"></small></button></template>
      </div>
      <label class="f" style="margin-top:14px"><span class="t">Genauer: <span x-text="wz.a.years + ' Jahre'"></span></span><input type="range" min="1" max="40" x-model.number="wz.a.years"></label>
      <label class="f"><span class="t">Hast du einen Betrag im Kopf? (freiwillig)</span><div class="suffix"><input type="number" min="0" step="500" x-model.number="wz.a.amount" placeholder="z. B. 10000"><span x-text="curSym()"></span></div></label>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 3">
      <h2>Wie viel kannst du im Monat zur Seite legen?</h2>
      <label class="f"><span class="t">Betrag pro Monat</span><div class="suffix"><input type="number" min="0" step="25" x-model.number="wz.a.monthly" placeholder="z. B. 100"><span x-text="curSym()"></span></div></label>
      <label class="check"><input type="checkbox" x-model="wz.helpIncome"><span>Weiß ich nicht, hilf mir beim Ausrechnen</span></label>
      <div x-show="wz.helpIncome" class="sub-box">
        <div class="grid g2">
          <label class="f"><span class="t">Netto-Einkommen im Monat</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.income"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Ausgaben im Monat (alles)</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.expenses"><span x-text="curSym()"></span></div>
            <div class="hint">Miete, Strom, Handy, Versicherungen, Essen, Freizeit</div></label>
        </div>
        <template x-if="wz.a.income > 0">
          <div class="ok-box" x-show="wz.a.income - (wz.a.expenses || 0) > 0">
            <span x-text="'Dir bleiben etwa ' + money(wz.a.income - (wz.a.expenses || 0)) + ' im Monat. Faustregel: rund 20 % vom Netto sparen, also ' + money(suggestSaving()) + '.'"></span>
            <button class="small" style="margin-left:8px" @click="wz.a.monthly = suggestSaving()">Übernehmen</button>
          </div>
        </template>
        <div class="notice" x-show="wz.a.income > 0 && wz.a.income - (wz.a.expenses || 0) <= 0">Deine Ausgaben sind so hoch wie dein Einkommen. Der erste Schritt ist dann, feste Kosten zu prüfen (Verträge, Abos, Versicherungen).</div>
      </div>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 4">
      <h2>Dein Polster</h2>
      <p class="ink2">Bevor du anlegst, brauchst du einen Notgroschen für Überraschungen (Waschmaschine kaputt, Jobwechsel). Faustregel: 3 Monatsausgaben.</p>
      <label class="f"><span class="t">Wie viel hast du auf Konto/Tagesgeld?</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.cash"><span x-text="curSym()"></span></div></label>
      <label class="f" x-show="!wz.a.expenses"><span class="t">Deine Ausgaben im Monat (ungefähr)</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.expenses"><span x-text="curSym()"></span></div></label>
      <label class="f"><span class="t">Teure Schulden (Dispo, Ratenkredit, Kreditkarte)</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.debt" placeholder="0"><span x-text="curSym()"></span></div>
        <div class="hint">Baufinanzierung oder BAföG zählen hier nicht.</div></label>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 5">
      <h2>Stell dir vor: Nach einem Jahr ist dein Geld 30 % weniger wert.</h2>
      <p class="ink2">Das passiert bei Aktien etwa alle 5 bis 10 Jahre. Was würdest du tun?</p>
      <div class="pick one">
        <template x-for="r in reactions" :key="r[0]"><button :class="wz.a.reaction === r[0] && 'sel'" @click="wz.a.reaction = r[0]"><b x-text="r[1]"></b><small x-text="r[2]"></small></button></template>
      </div>
      <label class="f" style="margin-top:14px"><span class="t">Hast du schon Erfahrung mit Geldanlage?</span>
        <select x-model="wz.a.experience"><option value="none">Nein, gar nicht</option><option value="some">Ein bisschen</option><option value="much">Ja, viel</option></select></label>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" :disabled="!wz.a.reaction || wz.busy" @click="wzFinish()" x-text="wz.busy ? 'Rechne …' : 'Plan anzeigen'"></button></div>
    </div>

    <template x-if="wz.step === 6 && wz.res">
      <div>
        <div class="card">
          <h2>So gehst du vor</h2>
          <ol class="plan-steps"><template x-for="s in wz.res.steps" :key="s.title"><li><b x-text="s.title"></b><span x-text="s.text"></span></li></template></ol>
        </div>
        <div class="card">
          <h2 x-text="wz.res.horizon === 'short' ? 'Wo das Geld hin sollte' : 'Eine passende Mischung'"></h2>
          <div class="alloc-bar big-bar"><template x-for="m in wz.res.mix" :key="m.key"><div :style="'width:' + m.pct + '%;background:' + mixCol(m)"></div></template></div>
          <template x-for="m in wz.res.mix" :key="m.key"><div class="mix-row"><i class="dot" :style="'background:' + mixCol(m)"></i><b x-text="m.pct + ' % ' + m.name"></b><span x-text="m.text"></span></div></template>
          <p class="muted" style="font-size:.85rem;margin-top:10px">Ein Vorschlag nach einfachen Regeln (Zeitraum und wie gut du Schwankungen aushältst), keine Anlageberatung. Welche konkreten ETFs es gibt, findest du unter <a href="#/maerkte">Märkte</a>.</p>
        </div>
        <div class="card" x-show="wz.res.forecast || wz.res.goal_text">
          <h2>Was daraus werden kann</h2>
          <template x-if="wz.res.forecast">
            <div class="tiles t3">
              <div class="tile"><div class="label">Eingezahlt</div><div class="v" x-text="money(wz.res.forecast.invested)"></div></div>
              <div class="tile key"><div class="label">Mittlerer Fall</div><div class="v" x-text="money(wz.res.forecast.p50)"></div></div>
              <div class="tile"><div class="label">Schlechter Fall (1 von 20)</div><div class="v" x-text="money(wz.res.forecast.p5)"></div></div>
            </div>
          </template>
          <ul class="sentences"><li x-show="wz.res.forecast" x-text="wz.res.forecast && wz.res.forecast.text"></li><li x-show="wz.res.goal_text" x-text="wz.res.goal_text"></li></ul>
        </div>
        <div class="card">
          <h2>Und jetzt?</h2>
          <div class="stack">
            <button class="primary wide" @click="wzSave()" :disabled="wz.saved" x-text="wz.saved ? '✓ In deinen Zielen gespeichert' : 'Plan als Ziel speichern'"></button>
            <a class="btn wide" :href="wzCalcLink()">Im Rechner mit echten Kursen genauer ansehen</a>
            <button class="wide" @click="openPlan(null, { asset: Object.keys(wz.res.weights)[0] || 'MSCIW', amount: wz.res.monthly })" x-show="wz.res.horizon !== 'short'">Ich spare schon so: Sparplan eintragen</button>
            <button class="wide" x-show="aiVisible()" @click="ask('Ich habe gerade den Start-Assistenten gemacht. Was hältst du von dem Plan, und was sollte ich als Erstes konkret tun?')">Mit dem KI-Ratgeber besprechen</button>
            <button class="ghost" @click="wzReset()">Nochmal von vorn</button>
          </div>
        </div>
      </div>
    </template>
  </div>
</section>

<!-- ---------- Mein Bestand ---------- -->
<section x-show="route === 'bestand'">
  <div class="page-head row between">
    <div><h1>Mein Bestand</h1><p>Alles, was du schon besitzt: Münzen, Barren, Schmuck, ETF-Anteile, Aktien, Krypto und Sparpläne.</p></div>
    <button class="primary" @click="openHolding()" x-show="pf && !pf.empty">+ Hinzufügen</button>
  </div>
  <template x-if="pf && pf.empty">
    <div>
      <div class="card empty-start">
        <h2>Du hast noch nichts eingetragen</h2>
        <p class="ink2">Kein Problem. Wähle, was zu dir passt:</p>
        <div class="start-opts">
          <a class="opt" href="#/start"><span class="ic">🧭</span><b>Ich will anfangen</b><span>5 Fragen, dann weißt du, wie viel du wo anlegen könntest.</span></a>
          <button class="opt" @click="openHolding()"><span class="ic">📦</span><b>Ich habe schon etwas</b><span>Goldmünze, Schmuck, ETF, Aktie oder Bitcoin eintragen.</span></button>
          <button class="opt" @click="openPlan()"><span class="ic">🔁</span><b>Ich habe einen Sparplan</b><span>Monatlicher Betrag seit einem Datum. Die Käufe rechnet das Tool nach.</span></button>
          <a class="opt" href="#/rechner/past"><span class="ic">⏪</span><b>Erst mal ausprobieren</b><span>Was wäre aus 50 € im Monat seit 2015 geworden?</span></a>
        </div>
      </div>
      <div class="card faq section">
        <h2>Gut zu wissen</h2>
        <details><summary>Warum sollte ich eintragen, was ich habe?</summary><p>Dann siehst du jeden Tag den Wert, bekommst ihn im Telegram-Bericht und der Ratgeber kann sagen, ob deine Mischung zu deinen Zielen passt.</p></details>
        <details><summary>Muss ich den Kaufpreis wissen?</summary><p>Nein. Ohne Kaufpreis siehst du den heutigen Wert. Kennst du das Kaufdatum, rechnet das Tool den Wert an diesem Tag aus.</p></details>
        <details><summary>Wer sieht meine Daten?</summary><p>Nur du (in deinem Profil) und, wenn du ihn nutzt, der KI-Ratgeber. Die Daten liegen auf dem Server zu Hause.</p></details>
      </div>
    </div>
  </template>
  <template x-if="pf && !pf.empty">
  <div>
    <div class="tiles">
      <div class="tile key"><div class="label">Wert heute</div><div class="v" x-text="money(pf.total)"></div></div>
      <div class="tile"><div class="label">Bezahlt (wo bekannt)</div><div class="v" x-text="pf.cost_known ? money(pf.cost_known) : '–'"></div></div>
      <div class="tile"><div class="label">Gewinn / Verlust</div><div class="v" :class="cls(pf.gain) + '-t'" x-text="pf.gain !== null ? signMoney(pf.gain) : '–'"></div></div>
      <div class="tile"><div class="label">Veränderung 7 Tage</div><div class="v" :class="cls(pf.change['7d'] && pf.change['7d'].pct) + '-t'" x-text="pf.change['7d'] ? pct(pf.change['7d'].pct) : '–'"></div></div>
    </div>
    <div class="row" style="margin-top:12px" x-show="aiVisible()"><button class="small" @click="ask('Schau dir meinen Bestand an: Ist er gut gemischt und passt er zu meinen Zielen?')">💬 Ist mein Bestand gut gemischt?</button></div>
    <div class="tabs" style="margin-top:18px">
      <button :class="pfTab === 'list' && 'sel'" @click="setPfTab('list')">Positionen</button>
      <button :class="pfTab === 'history' && 'sel'" @click="setPfTab('history')">Wie hat er sich entwickelt?</button>
    </div>

    <div x-show="pfTab === 'list'">
      <template x-for="g in groupedPositions()" :key="g.asset">
        <div class="card">
          <div class="row between"><h3 style="margin:0"><i class="dot" :style="'background:' + col(g.asset)"></i> <span x-text="g.name"></span></h3><b x-text="money(g.value)"></b></div>
          <div class="muted" style="font-size:.88rem" x-text="g.extra"></div>
          <template x-for="p in g.items" :key="p.kind + p.id">
            <div class="pos">
              <i class="bar" :style="'background:' + col(g.asset)"></i>
              <div>
                <div><b x-text="p.title"></b></div>
                <div class="muted" style="font-size:.88rem" x-text="p.sub + (p.kind === 'plan' ? '' : p.buy_date ? ' · gekauft ' + dateStr(p.buy_date) : ' · ohne Kaufdatum')"></div>
              </div>
              <div class="val">
                <div><b x-text="money(p.value)"></b></div>
                <div style="font-size:.88rem" :class="cls(p.gain) + '-t'" x-text="p.gain !== null ? signMoney(p.gain) + ' (' + pct(p.gain_pct, 0) + ')' : 'Kaufpreis fehlt'"></div>
                <div class="actions">
                  <button class="small ghost" @click="p.kind === 'plan' ? openPlan(p.id) : openHolding(p.raw)">Ändern</button>
                  <button class="small ghost" style="color:var(--bad)" @click="p.kind === 'plan' ? delPlan(p.id) : delHolding(p.id)">Löschen</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
      <div class="card section">
        <div class="row between"><h3 style="margin:0">Sparpläne</h3><button class="small" @click="openPlan()">+ Sparplan</button></div>
        <p class="ink2" style="margin-top:8px">Ein Sparplan kauft jeden Monat für einen festen Betrag. Das Tool rechnet die Käufe seit dem Start mit dem Kurs am jeweiligen Tag nach.</p>
        <template x-for="p in pf.plans" :key="p.id">
          <div class="pos">
            <i class="bar" :style="'background:' + col(p.asset)"></i>
            <div><b x-text="assetName(p.asset) + ': ' + money(p.amount, p.cur) + ' im Monat'"></b>
              <div class="muted" style="font-size:.88rem" x-text="'seit ' + dateStr(p.start) + (p.end ? ' bis ' + dateStr(p.end) : '') + ' · ' + p.executions + ' Käufe' + (p.running ? '' : ' · beendet')"></div></div>
            <div class="val"><b x-text="money(p.value)"></b><div class="muted" style="font-size:.88rem" x-text="'eingezahlt ' + money(p.invested)"></div></div>
          </div>
        </template>
        <div class="muted" x-show="!pf.plans.length">Noch kein Sparplan.</div>
      </div>
    </div>

    <div x-show="pfTab === 'history'">
      <template x-if="hist && hist.empty">
        <div class="card"><h3>Noch kein Verlauf</h3><p class="ink2">Für den Verlauf braucht das Tool ein Kaufdatum. Ergänze es bei deinen Positionen oder lege einen Sparplan mit Startdatum an.</p></div>
      </template>
      <template x-if="hist && !hist.empty">
        <div class="card">
          <div class="row between"><h3 style="margin:0">So hat sich dein Bestand entwickelt</h3>
            <div class="seg"><button class="small" :class="histMode === 'total' && 'sel'" @click="histMode = 'total'; drawHistory()">Gesamt</button><button class="small" :class="histMode === 'assets' && 'sel'" @click="histMode = 'assets'; drawHistory()">Nach Anlage</button></div></div>
          <ul class="sentences">
            <li x-text="'Seit ' + dateStr(hist.start) + ' hast du ' + money(hist.invested_total) + ' investiert. Heute ist es ' + money(hist.final) + ' wert (' + pct(hist.final / hist.invested_total - 1, 0) + ').'"></li>
            <li x-text="'Der größte Rückgang vom Höchststand: ' + pct(hist.max_dd, 0) + ' (Tiefpunkt ' + dateStr(hist.max_dd_date) + ').'"></li>
            <li x-show="hist.skipped" x-text="hist.skipped + ' Position(en) ohne Kaufdatum sind nicht enthalten.'"></li>
          </ul>
          <div id="ch-history" class="chart tall"></div>
          <p class="muted" style="font-size:.85rem">Positionen ohne Kaufpreis zählen mit ihrem Wert am Kaufdatum als „bezahlt“.</p>
        </div>
      </template>
    </div>
  </div>
  </template>
</section>

<!-- ---------- Ziele & Finanzprofil ---------- -->
<section x-show="route === 'ziele'">
  <div class="page-head"><h1>Ziele & Finanzprofil</h1><p>Je mehr der Ratgeber über dich weiß, desto passender werden Tipps, Rechner und KI-Antworten. Alles ist freiwillig und wird sofort gespeichert.</p></div>
  <template x-if="fin">
  <div class="grid g2" style="align-items:start">
    <div class="stack">
      <div class="card">
        <div class="row between"><h2 style="margin:0">Deine Ziele</h2><button class="small" @click="openGoal()">+ Ziel</button></div>
        <template x-if="!fin.goals.length">
          <div style="margin-top:10px"><p class="ink2">Noch kein Ziel. Ein Ziel ist ein Betrag zu einem Zeitpunkt, zum Beispiel „10.000 € fürs Auto in 4 Jahren“.</p>
            <a class="btn primary" href="#/start">Mit dem Plan-Assistenten festlegen</a></div>
        </template>
        <template x-for="g in fin.goals" :key="g.id">
          <div class="goal-row">
            <div><b x-text="g.name"></b><div class="muted" style="font-size:.88rem" x-text="purposeName(g.purpose) + (g.amount ? ' · ' + money(g.amount) : '') + (g.years ? ' in ' + num(g.years, 0) + ' Jahren' : '')"></div>
              <div style="font-size:.9rem" x-show="g.plan" x-text="g.plan ? 'Nötig: etwa ' + money(g.plan.monthly) + ' im Monat (' + g.plan.label + ')' : ''"></div></div>
            <div class="actions"><button class="small ghost" @click="openGoal(g)">Ändern</button><button class="small ghost" style="color:var(--bad)" @click="delGoal(g.id)">Löschen</button></div>
          </div>
        </template>
        <div class="notice" style="margin-top:10px" x-show="fin.goals.length && goalNeed() > 0" x-text="goalNeedText()"></div>
      </div>
      <div class="card">
        <h2>Dein Geld im Monat</h2>
        <div class="grid g2">
          <label class="f"><span class="t">Netto-Einkommen</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.income" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Ausgaben (alles)</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.expenses" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Sparrate</span><div class="suffix"><input type="number" min="0" step="25" x-model.number="finEdit.saving" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Auf Konto/Tagesgeld</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.cash" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Teure Schulden</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.debt" @input="saveFin()" placeholder="0"><span x-text="curSym()"></span></div></label>
        </div>
        <ul class="sentences" style="margin-top:0">
          <li x-show="fin.free !== null" x-text="'Frei im Monat: ' + money(fin.free) + (finEdit.income ? ' (' + num(fin.free / finEdit.income * 100, 0) + ' % vom Netto).' : '.')"></li>
          <li x-show="fin.emergency" x-text="'Notgroschen-Ziel (3 Monatsausgaben): ' + money(fin.emergency) + ((finEdit.cash || 0) >= fin.emergency ? ' – erreicht ✓' : ' – es fehlen ' + money(fin.emergency - (finEdit.cash || 0)) + '.')"></li>
        </ul>
        <a class="more" href="#/rechner/budget">Sparrate genauer ausrechnen →</a>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <h2>Du und Risiko</h2>
        <span class="t" style="font-weight:600;font-size:.93rem;display:block;margin-bottom:6px">Wie viel Schwankung hältst du aus?</span>
        <div class="risk-pick"><template x-for="r in riskLevels" :key="r[0]"><button :class="finEdit.risk === r[0] && 'sel'" @click="finEdit.risk = r[0]; saveFin()"><b x-text="r[0]"></b><small x-text="r[1]"></small></button></template></div>
        <div class="hint" x-text="riskText(finEdit.risk)"></div>
        <div class="grid g2" style="margin-top:12px">
          <label class="f"><span class="t">Erfahrung</span><select x-model="finEdit.experience" @change="saveFin()"><option value="">–</option><option value="none">keine</option><option value="some">etwas</option><option value="much">viel</option></select></label>
          <label class="f"><span class="t">Alter</span><input type="number" min="14" max="110" x-model.number="finEdit.age" @input="saveFin()" placeholder="–"></label>
        </div>
      </div>
      <div class="card">
        <h2>Steuern</h2>
        <label class="check"><input type="checkbox" x-model="finEdit.married" @change="saveFin()"><span>Verheiratet / zusammen veranlagt <span class="muted">(doppelter Freibetrag)</span></span></label>
        <label class="f"><span class="t">Kirchensteuer</span><select x-model="finEdit.church" @change="saveFin()"><option value="none">keine</option><option value="8">8 % (Bayern, Baden-Württemberg)</option><option value="9">9 % (andere Länder)</option></select></label>
        <label class="f"><span class="t">Zu versteuerndes Einkommen im Jahr</span><div class="suffix"><input type="number" min="0" step="1000" x-model.number="finEdit.zve" @input="saveFin()" placeholder="steht im Steuerbescheid"><span x-text="curSym()"></span></div>
          <div class="hint">Weißt du nicht? <a href="#/rechner/taxrate">Aus dem Bruttogehalt schätzen →</a></div></label>
        <div class="ok-box" x-show="fin.personal_rate_auto" x-text="'Dein Grenzsteuersatz: ' + num(fin.personal_rate * 100, 1) + ' %. Er wird für Gold, Silber und Krypto genutzt, die du innerhalb eines Jahres verkaufst. Sparerpauschbetrag: ' + money(fin.allowance) + '.'"></div>
      </div>
      <div class="card">
        <h2>Notizen für den Ratgeber</h2>
        <textarea rows="3" maxlength="1500" x-model="finEdit.notes" @input="saveFin()" placeholder="z. B. Ich bin selbstständig, plane in 2 Jahren eine Weltreise …"></textarea>
        <div class="hint">Der KI-Ratgeber liest das mit und kann hier auch selbst Dinge eintragen, die du ihm erzählst.</div>
      </div>
    </div>
  </div>
  </template>
</section>

<!-- ---------- Rechner ---------- -->
<section x-show="route === 'rechner'">
  <template x-if="!calcId">
    <div>
      <div class="page-head"><h1>Rechner</h1><p>Wähle eine Frage. Die Rechner mit „echten Kursen“ spielen tausende mögliche Verläufe durch, die anderen rechnen mit einer festen Annahme, die du selbst einstellst.</p></div>
      <template x-for="cat in calcCats" :key="cat.id">
        <div class="section" x-show="calcsIn(cat.id).length">
          <h2 x-text="cat.label"></h2>
          <div class="calc-grid">
            <template x-for="c in calcsIn(cat.id)" :key="c.id">
              <a class="card calc-card" :href="'#/rechner/' + c.id"><span class="ic" x-text="c.icon"></span><b x-text="c.title"></b><small x-text="c.question"></small><span class="tag" x-show="c.ui === 'custom'">echte Kurse</span></a>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="calcId && calcDef">
    <div>
      <a href="#/rechner" class="back">← Alle Rechner</a>
      <div class="page-head"><h1><span x-text="calcDef.icon"></span> <span x-text="calcDef.title"></span></h1><p x-text="calcDef.question"></p></div>

      <!-- generische Rechner -->
      <template x-if="calcDef.ui === 'generic'">
        <div class="calc">
          <div class="card inputs">
            <template x-for="f in calcDef.fields" :key="f.key">
              <div x-show="fieldVisible(f)">
                <template x-if="['money', 'number', 'percent', 'years'].includes(f.type)">
                  <label class="f"><span class="t"><span x-text="f.label"></span><button type="button" class="help" x-show="f.help" @click.prevent="toggleHelp(calcId + f.key)">?</button></span>
                    <div class="help-box" x-show="help[calcId + f.key]" x-text="f.help"></div>
                    <div class="suffix"><input type="number" :min="f.min" :max="f.max" :step="f.step || (f.type === 'money' ? 'any' : 1)" x-model.number="gv[f.key]" @input="recalcG()"><span x-text="fieldSuffix(f)"></span></div></label>
                </template>
                <template x-if="f.type === 'select'">
                  <label class="f"><span class="t"><span x-text="f.label"></span><button type="button" class="help" x-show="f.help" @click.prevent="toggleHelp(calcId + f.key)">?</button></span>
                    <div class="help-box" x-show="help[calcId + f.key]" x-text="f.help"></div>
                    <select x-model="gv[f.key]" @change="recalcG()"><template x-for="o in f.options" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] == gv[f.key]"></option></template></select></label>
                </template>
                <template x-if="f.type === 'toggle'">
                  <label class="check"><input type="checkbox" x-model="gv[f.key]" @change="recalcG()"><span x-text="f.label"></span></label>
                </template>
                <template x-if="f.type === 'market'">
                  <label class="f"><span class="t" x-text="f.label"></span>
                    <select x-model="gv[f.key]" @change="recalcG()"><template x-for="k in marketGroups()" :key="k.id"><optgroup :label="k.label"><template x-for="a in k.items" :key="a"><option :value="a" x-text="assetName(a)" :selected="a === gv[f.key]"></option></template></optgroup></template></select></label>
                </template>
                <template x-if="f.type === 'date'">
                  <label class="f"><span class="t" x-text="f.label"></span><input type="date" x-model="gv[f.key]" @change="recalcG()"></label>
                </template>
              </div>
            </template>
          </div>
          <div>
            <div class="err" x-show="calcErr" x-text="calcErr"></div>
            <div class="busy" x-show="busy">Rechnet …</div>
            <template x-if="gres">
              <div class="card">
                <div class="tiles" :class="'t' + Math.min((gres.tiles || []).length, 4)" x-show="gres.tiles && gres.tiles.length">
                  <template x-for="t in gres.tiles" :key="t.label"><div class="tile" :class="t.tone === 'accent' && 'key'"><div class="label" x-text="t.label"></div><div class="v" :class="t.tone === 'good' ? 'up-t' : t.tone === 'bad' ? 'down-t' : ''" x-text="t.value"></div><small x-show="t.note" x-text="t.note"></small></div></template>
                </div>
                <ul class="sentences"><template x-for="t in gres.text || []"><li x-text="t"></li></template></ul>
                <template x-for="(c, i) in gres.charts || []" :key="i">
                  <div class="section"><h3 x-text="c.title"></h3><div :id="'ch-g' + i" class="chart" :class="c.type === 'hbar' ? 'small' : ''"></div><p class="muted" style="font-size:.85rem" x-show="c.note" x-text="c.note"></p></div>
                </template>
                <template x-if="gres.table">
                  <details class="section" :open="!(gres.charts || []).length"><summary style="cursor:pointer;font-weight:600" x-text="gres.table.title || 'Tabelle'"></summary>
                    <div class="table-wrap"><table class="t"><thead><tr><template x-for="h in gres.table.head"><th x-text="h"></th></template></tr></thead>
                      <tbody><template x-for="(r, ri) in gres.table.rows" :key="ri"><tr><template x-for="(v, ci) in r" :key="ci"><td x-text="v"></td></template></tr></template></tbody></table></div>
                  </details>
                </template>
                <div class="row section" x-show="(gres.actions || []).length || aiVisible()">
                  <template x-for="a in gres.actions || []" :key="a.label"><button :class="a.type === 'save_finance' ? 'primary small' : 'small'" @click="calcAction(a)" x-text="a.label"></button></template>
                  <button class="small" x-show="aiVisible()" @click="ask('Erklär mir bitte dieses Ergebnis in einfachen Worten und was es für mich bedeutet.')">💬 Erklär mir das</button>
                </div>
                <p class="muted" style="font-size:.82rem;margin-top:12px"><template x-for="n in gres.notes || []"><span x-text="n + ' '"></span></template></p>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Simulationen mit echten Kursen -->
      <template x-if="calcDef.ui === 'custom'">
      <div class="calc">
        <div class="card inputs">
          <template x-if="calc.q === 'goal'">
            <label class="f"><span class="t">Zielbetrag <button type="button" class="help" @click="toggleHelp('goal')">?</button></span>
              <div class="help-box" x-show="help.goal">Wie viel möchtest du am Ende haben? Zum Beispiel für ein Auto, eine Wohnung oder als Rücklage.</div>
              <div class="suffix"><input type="number" min="0" step="1000" x-model.number="calc.goal" @input="recalc()"><span x-text="curSym()"></span></div></label>
          </template>
          <label class="f"><span class="t">Startbetrag <button type="button" class="help" @click="toggleHelp('initial')">?</button></span>
            <div class="help-box" x-show="help.initial">Geld, das du am Anfang auf einmal anlegst. 0, wenn du nur monatlich sparst.</div>
            <div class="suffix"><input type="number" min="0" step="100" x-model.number="calc.initial" @input="recalc()"><span x-text="curSym()"></span></div></label>
          <template x-if="calc.q !== 'past' && pfTotal() > 0">
            <label class="check"><input type="checkbox" x-model="calc.use_holdings" @change="recalc()"><span>Meinen Bestand dazunehmen <span class="muted" x-text="'(' + money(pfTotal()) + ')'"></span></span></label>
          </template>
          <template x-if="calc.q !== 'goal'">
            <label class="f"><span class="t">Sparrate pro Monat <button type="button" class="help" @click="toggleHelp('monthly')">?</button></span>
              <div class="help-box" x-show="help.monthly">Betrag, den du jeden Monat dazu kaufst. Beim Sparplan kaufst du automatisch mal teuer, mal günstig.</div>
              <div class="suffix"><input type="number" min="0" step="25" x-model.number="calc.monthly" @input="recalc()"><span x-text="curSym()"></span></div></label>
          </template>
          <template x-if="calc.q !== 'past'">
            <label class="f"><span class="t">Laufzeit: <span x-text="calc.years + ' Jahre'"></span> <button type="button" class="help" @click="toggleHelp('years')">?</button></span>
              <div class="help-box" x-show="help.years">Wie lange du das Geld liegen lässt. Je länger, desto eher gleichen sich Schwankungen aus, sicher ist es aber nie.</div>
              <input type="range" min="1" max="40" x-model.number="calc.years" @input="recalc()"></label>
          </template>
          <template x-if="calc.q === 'past'">
            <label class="f"><span class="t">Start <button type="button" class="help" @click="toggleHelp('start')">?</button></span>
              <div class="help-box" x-show="help.start">Ab wann hättest du angelegt? Gerechnet wird bis zum letzten Börsentag, mit echten Kursen und Wechselkursen.</div>
              <input type="month" x-model="calc.start" @change="recalc()" min="2000-01">
              <div class="seg" style="margin-top:6px"><template x-for="y in [1, 3, 5, 10, 20]" :key="y"><button type="button" class="small" @click="calc.start = yearsAgo(y); recalc()" x-text="'vor ' + y + ' J.'"></button></template></div></label>
          </template>

          <div class="f weights">
            <div class="row between" style="margin-bottom:8px"><span style="font-weight:600;font-size:.93rem">Worin? <button type="button" class="help" @click="toggleHelp('weights')">?</button></span><small x-show="wSum() !== 100 && wSum() > 0" x-text="'Summe ' + wSum() + ' %, wird auf 100 % umgerechnet'"></small></div>
            <div class="help-box" x-show="help.weights">Worauf verteilst du das Geld? Eine Mischung schwankt meist weniger als eine einzelne Anlage. Mit „+ Anlage“ kannst du jeden Markt aus der Liste dazunehmen.</div>
            <template x-for="a in wKeys()" :key="a">
              <div class="w-row"><b :title="assetName(a)"><i class="dot" :style="'background:' + col(a)"></i><span x-text="shortName(a)"></span></b>
                <input type="range" min="0" max="100" step="5" x-model.number="calc.weights[a]" @input="recalc()"><output x-text="calc.weights[a] + ' %'"></output>
                <button type="button" class="x" @click="wRemove(a)" title="Entfernen">×</button></div>
            </template>
            <select class="add-sel" @change="wAdd($event.target.value); $event.target.value = ''">
              <option value="">+ Anlage hinzufügen …</option>
              <template x-for="k in marketGroups()" :key="k.id"><optgroup :label="k.label"><template x-for="a in k.items.filter((x) => !(x in calc.weights))" :key="a"><option :value="a" x-text="assetName(a)"></option></template></optgroup></template>
            </select>
            <div class="seg" style="margin-top:8px">
              <button type="button" class="small" @click="preset({MSCIW: 100})">Nur Welt-ETF</button>
              <button type="button" class="small" @click="preset({MSCIW: 70, EUGOV: 30})">ETF + Anleihen</button>
              <button type="button" class="small" @click="preset({MSCIW: 80, GOLD: 20})">ETF + Gold</button>
              <button type="button" class="small" @click="presetWatch()">Meine Märkte gleich</button>
            </div>
          </div>

          <details class="adv">
            <summary>Erweitert: Annahmen, Kosten, Steuern</summary>
            <template x-if="calc.q !== 'past'">
              <label class="f"><span class="t">Trend-Annahme <button type="button" class="help" @click="toggleHelp('drift')">?</button></span>
                <div class="help-box" x-show="help.drift">„Vorsichtig“ nimmt weniger Wachstum an als in der Vergangenheit (bei Bitcoin höchstens 15 % im Jahr). „Wie bisher“ überträgt den Durchschnitt der Vergangenheit, das ist bei Bitcoin sehr optimistisch. „Ohne Trend“ zeigt nur die Schwankung.</div>
                <select x-model="calc.drift" @change="recalc()"><option value="careful">Vorsichtig (empfohlen)</option><option value="historic">Wie in der Vergangenheit</option><option value="none">Ohne Trend, nur Schwankung</option></select></label>
            </template>
            <label class="check"><input type="checkbox" x-model="calc.costs" @change="recalc()"><span>Kosten berücksichtigen <span class="muted">(Kaufgebühr, Spanne An-/Verkauf, Lagerkosten)</span></span></label>
            <label class="check" x-show="calc.q !== 'goal'"><input type="checkbox" x-model="calc.tax" @change="recalc()"><span>Steuern berücksichtigen <span class="muted" x-text="'(' + taxName() + ')'"></span></span></label>

            <label class="f" x-show="calc.q !== 'goal'" style="margin-top:8px"><span class="t">Aufteilung wiederherstellen <button type="button" class="help" @click="toggleHelp('rebalance')">?</button></span>
              <div class="help-box" x-show="help.rebalance">Einmal im Jahr wird umgeschichtet, damit die Aufteilung wieder stimmt. Das verkauft, was gut lief, und kauft, was schlecht lief.</div>
              <select x-model="calc.rebalance" @change="recalc()"><option value="none">Nein</option><option value="yearly">Jährlich</option><option value="quarterly">Vierteljährlich</option></select></label>
            <template x-if="calc.q === 'future'">

                <div class="help-box" x-show="help.withdraw">Zum Beispiel als Zusatzrente: ab einem bestimmten Jahr jeden Monat einen festen Betrag herausnehmen.</div>
                <div class="grid g2"><div class="suffix"><input type="number" min="0" step="50" x-model.number="calc.wd_monthly" @input="recalc()"><span x-text="curSym()"></span></div>
                  <div class="suffix"><input type="number" min="1" max="40" x-model.number="calc.wd_from" @input="recalc()"><span>Jahr</span></div></div></label>
            </template>
          </details>
        </div>

        <div>
          <div class="err" x-show="calcErr" x-text="calcErr"></div>
          <div class="busy" x-show="busy">Rechnet …</div>
          <template x-if="res && res.q === 'future' && calc.q === 'future'">
            <div class="card">
              <div class="tiles">
                <div class="tile"><div class="label">Eingesetzt</div><div class="v" x-text="money(res.invested)"></div></div>
                <div class="tile key"><div class="label" x-text="'Mittlerer Fall' + (res.net_label ? ' (' + res.net_label + ')' : '')"></div><div class="v" x-text="money(res.end['50'])"></div></div>
                <div class="tile"><div class="label">Schlechter Fall (1 von 20)</div><div class="v" x-text="money(res.end['5'])"></div></div>
                <div class="tile"><div class="label">Chance auf Verlust</div><div class="v" x-text="num(res.p_loss * 100, 0) + ' %'"></div></div>
              </div>
              <ul class="sentences"><template x-for="t in res.text"><li x-text="t"></li></template></ul>
              <div class="row between section" style="margin-top:18px">
                <h3 style="margin:0" x-text="'Dein Depot in ' + res.years + ' Jahren'"></h3>
                <div class="seg"><button class="small" :class="futView === 'fan' && 'sel'" @click="futView = 'fan'; drawCalc()">Spanne</button><button class="small" :class="futView === 'bars' && 'sel'" @click="futView = 'bars'; drawCalc()">Jahresbalken</button></div>
              </div>
              <div id="ch-calc" class="chart tall"></div>
              <p class="muted" style="font-size:.85rem" x-show="futView === 'fan'" x-text="fanNote + (res.net_label ? ' Das Diagramm zeigt den Depotwert vor dem Verkauf.' : '')"></p>
              <p class="muted" style="font-size:.85rem" x-show="futView === 'bars'">Balken = mittlerer Fall. Grau ist, was du eingezahlt hast, violett der Zuwachs.</p>
              <template x-if="res.stress"><div class="notice" style="margin-top:12px"><b>Härtetest:</b> <span x-text="stressText()"></span></div></template>
              <template x-if="res.ran_out_share !== null && res.ran_out_share !== undefined">
                <div class="notice" style="margin-top:12px" x-text="'Entnahme: In ' + num(res.ran_out_share * 100, 0) + ' % der Fälle ist das Geld vor dem Ende aufgebraucht.'"></div>
              </template>
              <div class="row section" x-show="aiVisible()"><button class="small" @click="ask('Erklär mir bitte dieses Ergebnis in einfachen Worten: Was heißt die Spanne, und ist die Aufteilung für mich sinnvoll?')">💬 Erklär mir das</button></div>
              <details class="section"><summary style="cursor:pointer;font-weight:600">Jahr für Jahr</summary>
                <div class="table-wrap"><table class="t"><thead><tr><th>Jahr</th><th>Eingesetzt</th><th>Schlecht (1 von 20)</th><th>Mittel</th><th>Gut (1 von 20)</th></tr></thead>
                  <tbody><template x-for="r in res.rows" :key="r.year"><tr><td x-text="r.year"></td><td x-text="money(r.invested)"></td><td x-text="money(r.p5)"></td><td><b x-text="money(r.p50)"></b></td><td x-text="money(r.p95)"></td></tr></template></tbody></table></div>
              </details>
              <p class="muted" style="font-size:.82rem;margin-top:12px" x-text="assumptionText()"></p>
            </div>
          </template>
          <template x-if="res && res.q === 'goal' && calc.q === 'goal'">
            <div class="card">
              <div class="tiles">
                <div class="tile key"><div class="label">Mittlerer Fall</div><div class="v" x-text="money(res.monthly_50) + ' /Monat'"></div></div>
                <div class="tile"><div class="label">Sicherer (3 von 4)</div><div class="v" x-text="money(res.monthly_75) + ' /Monat'"></div></div>
                <div class="tile"><div class="label">Sehr sicher (9 von 10)</div><div class="v" x-text="money(res.monthly_90) + ' /Monat'"></div></div>
                <div class="tile"><div class="label">Ohne Anlage</div><div class="v" x-text="money(res.no_risk) + ' /Monat'"></div></div>
              </div>
              <ul class="sentences"><template x-for="t in res.text"><li x-text="t"></li></template></ul>
              <p class="ink2 section">Tipp: Nimm die Rate aus „Mittlerer Fall“ und prüfe sie unter <a :href="goalToFutureLink()">„Was könnte daraus werden?“</a>, dann siehst du die ganze Spanne.</p>
              <div class="row" x-show="aiVisible()"><button class="small" @click="ask('Erklär mir bitte dieses Ergebnis: Welche Sparrate sollte ich wählen?')">💬 Erklär mir das</button></div>
              <p class="muted" style="font-size:.82rem" x-text="'Annahmen: Trend ' + res.assumptions.drift + ', ' + (res.assumptions.costs ? 'mit Kosten' : 'ohne Kosten') + ', vor Steuern, ' + res.assumptions.n_sims + ' durchgespielte Verläufe aus echten Kursen seit ' + dateStr(res.assumptions.history_from) + '.'"></p>
            </div>
          </template>
          <template x-if="res && res.q === 'past' && calc.q === 'past'">
            <div class="card">
              <template x-for="n in res.notes"><div class="notice" style="margin-bottom:10px" x-text="n"></div></template>
              <div class="tiles">
                <div class="tile"><div class="label">Eingezahlt</div><div class="v" x-text="money(res.invested)"></div></div>
                <div class="tile key"><div class="label" x-text="'Wert heute' + (res.net_label ? ' (' + res.net_label + ')' : '')"></div><div class="v" x-text="money(res.final)"></div></div>
                <div class="tile"><div class="label">Gewinn / Verlust</div><div class="v" :class="cls(res.final - res.invested) + '-t'" x-text="signMoney(res.final - res.invested)"></div></div>
                <div class="tile"><div class="label">Größter Rückgang</div><div class="v down-t" x-text="pct(res.max_dd, 0)"></div></div>
              </div>
              <ul class="sentences"><template x-for="t in res.text"><li x-text="t"></li></template></ul>
              <h3 class="section">Verlauf</h3>
              <div id="ch-calc" class="chart tall"></div>
              <p class="muted" style="font-size:.85rem" x-show="res.net_label">Das Diagramm zeigt den Depotwert vor dem Verkauf, die Kacheln oben den Erlös <span x-text="res.net_label"></span>.</p>
              <h3 class="section">Zum Vergleich: alles in eine Anlage</h3>
              <p class="ink2" style="font-size:.93rem">Gleiche Einzahlungen, gleicher Zeitraum.</p>
              <div id="ch-compare" class="chart small"></div>
              <div class="row section" x-show="aiVisible()"><button class="small" @click="ask('Erklär mir bitte dieses Ergebnis: Was lerne ich daraus für die Zukunft?')">💬 Erklär mir das</button></div>
              <details class="section"><summary style="cursor:pointer;font-weight:600">Jahr für Jahr</summary>
                <div class="table-wrap"><table class="t"><thead><tr><th>Zeitpunkt</th><th>Eingezahlt</th><th>Wert</th><th>Gewinn</th></tr></thead>
                  <tbody><template x-for="r in res.rows" :key="r.date"><tr><td x-text="r.label"></td><td x-text="money(r.invested)"></td><td><b x-text="money(r.value)"></b></td><td :class="cls(r.value - r.invested) + '-t'" x-text="signMoney(r.value - r.invested)"></td></tr></template></tbody></table></div>
              </details>
              <p class="muted" style="font-size:.82rem;margin-top:12px" x-text="'Annahmen: ' + (res.assumptions.costs ? 'mit Kosten' : 'ohne Kosten') + ', ' + res.assumptions.tax + (res.assumptions.fx ? ', mit echten Wechselkursen' : '') + '. Kauf jeweils zum Tagesschlusskurs.'"></p>
            </div>
          </template>
        </div>
      </div>
      </template>

      <div class="section card faq" x-show="calcDef.ui === 'custom'">
        <h2>So funktioniert der Rechner</h2>
        <details><summary>Woher kommen die Zahlen für die Zukunft?</summary><p>Das Tool spielt einige tausend mögliche Verläufe durch. Jeder Verlauf besteht aus echten 20-Tage-Abschnitten der Vergangenheit, zufällig aneinandergereiht und für alle Anlagen mit denselben Tagen. So bleiben echte Krisen, echte Erholungen und der Zusammenhang zwischen den Anlagen erhalten.</p></details>
        <details><summary>Was bedeuten „mittlerer Fall“ und „1 von 20“?</summary><p>Sortiert man alle durchgespielten Verläufe nach dem Ergebnis, liegt der mittlere Fall genau in der Mitte. „Schlechter Fall (1 von 20)“ heißt: Nur jeder zwanzigste Verlauf war noch schlechter.</p></details>
        <details><summary>Stimmen diese Spannen?</summary><p>Das Tool prüft sich jede Nacht selbst: Es tut so, als stünde es an einem Tag in der Vergangenheit, rechnet die Spanne aus und vergleicht mit dem, was danach wirklich passierte. Details unter <a href="#/methodik">Methodik</a>.</p></details>
        <details><summary>Kann das Tool sagen, ob es morgen hoch oder runter geht?</summary><p>Nein. Kein getestetes Modell sagt die Richtung nach Gebühren besser voraus als die simple Annahme „steigt langfristig“. Deshalb gibt es hier Spannen statt Kursziele.</p></details>
      </div>
    </div>
  </template>
</section>

<!-- ---------- Methodik ---------- -->
<section x-show="route === 'methodik'">
  <div class="page-head"><h1>Wie rechnet das Tool?</h1><p>Niemand kann Kurse vorhersagen. Dieses Tool zeigt deshalb Spannen und prüft jede Nacht, ob diese Spannen in der Vergangenheit gestimmt hätten.</p></div>
  <template x-if="meth">
  <div class="stack">
    <div class="card">
      <h2>Treffen die Spannen?</h2>
      <p class="ink2">So oft lag der echte Kurs später innerhalb der 90-%-Spanne, die das Tool vorher berechnet hätte. Ideal sind 90 %. Gezeigt: deine Märkte.</p>
      <div class="table-wrap"><table class="t"><thead><tr><th>Anlage</th><th>in 30 Tagen</th><th>in 90 Tagen</th><th>in 1 Jahr</th></tr></thead>
        <tbody><template x-for="(m, a) in meth" :key="a"><tr><td><i class="dot" :style="'background:' + col(a)"></i> <span x-text="m.name"></span></td>
          <template x-for="d in [30, 90, 365]" :key="d"><td x-text="covText(m, d)"></td></template></tr></template></tbody></table></div>
    </div>
    <div class="card">
      <h2>Kann man die Richtung vorhersagen?</h2>
      <p class="ink2">Getestet wurden unter anderem Momentum (was gestiegen ist, steigt weiter), die 200-Tage-Linie und ein Lernmodell. Verglichen wird mit „steigt immer“. Ein Modell zählt nur, wenn es nach Gebühren klar besser ist.</p>
      <div class="table-wrap"><table class="t"><thead><tr><th>Anlage</th><th>Zeitraum</th><th>„Steigt immer“ traf</th><th>Bestes Modell</th><th>traf</th><th>Besser?</th></tr></thead>
        <tbody><template x-for="row in dirRows()" :key="row.k"><tr><td x-text="row.name"></td><td x-text="row.days + ' Tage'"></td><td x-text="num(row.base * 100, 0) + ' %'"></td><td x-text="row.best"></td><td x-text="num(row.best_hit * 100, 0) + ' %'"></td><td x-text="row.approved ? 'ja' : 'nein'"></td></tr></template></tbody></table></div>
    </div>
    <div class="card faq">
      <h2>Begriffe</h2>
      <details><summary>ETF</summary><p>Ein Fonds, der an der Börse gehandelt wird und einfach einen Index nachbildet, zum Beispiel die 1.500 größten Firmen der Welt. Günstig (oft 0,1–0,3 % Kosten im Jahr) und breit gestreut.</p></details>
      <details><summary>Spotpreis und Materialwert</summary><p>Der Spotpreis ist der aktuelle Börsenpreis für reines Edelmetall. Der Materialwert deiner Münze oder Kette ist Feingewicht × Spotpreis. Händler zahlen beim Ankauf meist 2–10 % weniger, bei Schmuck oft deutlich weniger.</p></details>
      <details><summary>Feinheit (z. B. 585)</summary><p>Die Feinheit sagt, wie viel Tausendstel reines Metall enthalten sind. 585 heißt 58,5 % Gold, der Rest sind andere Metalle.</p></details>
      <details><summary>Schwankung</summary><p>Wie stark der Kurs typischerweise hoch und runter geht. „±8 % pro Monat“ heißt: In etwa 2 von 3 Monaten bewegt sich der Kurs um weniger als 8 %.</p></details>
      <details><summary>Datenquellen</summary><p>Kurse: Binance, Yahoo Finance (alle 5 Minuten), Spotpreise von gold-api.com. Wechselkurse: Europäische Zentralbank. Inflation: Eurostat (HVPI).</p></details>
    </div>
  </div>
  </template>
</section>
</main>
<footer class="foot">
  Keine Anlageberatung. Prognosen sind Spannen aus der Vergangenheit, keine Garantie. · <a href="#/methodik">Wie rechnet das Tool?</a> · <span x-text="statusText"></span>
</footer>

  </form>
  <div class="chat-foot">KI kann sich irren. Keine Anlageberatung.</div>
</aside>

          <label class="f"><span class="t">Kaufdatum (freiwillig)</span><input type="date" x-model="hf.buy_date" @change="hfPreview()" max="9999-12-31"></label>
          <label class="f"><span class="t">Bezahlt insgesamt (freiwillig)</span><div class="suffix"><input type="number" min="0" step="any" x-model="hf.buy_price"><span x-text="curSym()"></span></div>
            <div class="hint" x-show="hf.buy_date && hfInfo && hfInfo.then"><a href="#" @click.prevent="hf.buy_price = Math.round(hfInfo.then)" x-text="'Wert am Kaufdatum übernehmen: ' + money(hfInfo && hfInfo.then)"></a></div></label>
        </div>
        <div class="ok-box" x-show="hfInfo && hfInfo.now" x-text="hfInfo ? hfInfo.text : ''"></div>
        <div class="err" style="margin-top:10px" x-show="hf.err" x-text="hf.err"></div>
        <div class="row" style="margin-top:14px"><button class="primary" @click="saveHolding()">Speichern</button><button class="ghost" @click="hf = null">Abbrechen</button></div>
      </div>
    </template>
  </div>
</div>
</template>

<!-- ---------- Dialog: Sparplan ---------- -->
<template x-if="plf">
<div class="modal-bg" @click.self="plf = null" @keydown.escape.window="plf = null">
  <div class="modal">
    <div class="row between"><h2 style="margin:0" x-text="plf.id ? 'Sparplan ändern' : 'Sparplan eintragen'"></h2><button class="ghost small" @click="plf = null">Schließen</button></div>
    <label class="f" style="margin-top:14px"><span class="t">Worin?</span>
      <select x-model="plf.asset"><template x-for="k in marketGroups()" :key="k.id"><optgroup :label="k.label"><template x-for="a in k.items" :key="a"><option :value="a" x-text="assetName(a)" :selected="a === plf.asset"></option></template></optgroup></template></select></label>
    <div class="grid g2">
      <label class="f"><span class="t">Betrag pro Monat</span><input type="number" min="1" step="any" x-model.number="plf.amount"></label>
      <label class="f"><span class="t">Währung</span><select x-model="plf.cur"><template x-for="(c, k) in meta.currencies" :key="k"><option :value="k" x-text="k" :selected="k === plf.cur"></option></template></select></label>
      <label class="f"><span class="t">Erster Kauf</span><input type="date" x-model="plf.start"></label>
      <label class="f"><span class="t">Ende (leer = läuft noch)</span><input type="date" x-model="plf.end"></label>
    </div>
    <div class="err" x-show="plf.err" x-text="plf.err"></div>
    <div class="row" style="margin-top:14px"><button class="primary" @click="savePlan()">Speichern</button><button class="ghost" @click="plf = null">Abbrechen</button></div>
  </div>
</div>
</template>

<!-- ---------- Dialog: Ziel ---------- -->
<template x-if="gf">
<div class="modal-bg" @click.self="gf = null" @keydown.escape.window="gf = null">
  <div class="modal">
    <div class="row between"><h2 style="margin:0" x-text="gf.id ? 'Ziel ändern' : 'Neues Ziel'"></h2><button class="ghost small" @click="gf = null">Schließen</button></div>
    <label class="f" style="margin-top:14px"><span class="t">Wofür?</span><select x-model="gf.purpose"><template x-for="(lbl, k) in meta.goal_purposes" :key="k"><option :value="k" x-text="lbl" :selected="k === gf.purpose"></option></template></select></label>
    <label class="f"><span class="t">Name</span><input x-model="gf.name" maxlength="60" placeholder="z. B. Auto"></label>
    <div class="grid g2">
      <label class="f"><span class="t">Betrag</span><div class="suffix"><input type="number" min="0" step="500" x-model.number="gf.amount"><span x-text="curSym()"></span></div></label>
      <label class="f"><span class="t">In wie vielen Jahren?</span><input type="number" min="0.5" max="60" step="0.5" x-model.number="gf.years"></label>
    </div>
    <div class="err" x-show="gf.err" x-text="gf.err"></div>
    <div class="row" style="margin-top:14px"><button class="primary" @click="saveGoal()">Speichern</button><button class="ghost" @click="gf = null">Abbrechen</button></div>
  </div>
</div>
</template>
<div class="toast" x-show="toast" x-transition x-text="toast"></div>
</div>
</template>
</body>
</html>
