<!-- ---------- Methodik ---------- -->
<section x-show="route === 'methodik'">
  <div class="page-head"><h1>Wie rechnet das Tool?</h1><p>Niemand kann Kurse (Preise) sicher vorhersagen. Das Tool zeigt deshalb Spannen, in denen das Ergebnis in 9 von 10 Fällen landet, und prüft jede Nacht, ob das früher gestimmt hätte.</p></div>
  <template x-if="meth">
  <div class="stack">
    <div class="card">
      <h2>Treffen die Spannen?</h2>
      <p class="ink2">So oft lag der echte Kurs später in der Spanne, die das Tool vorher berechnet hätte. Ideal sind 90 %, also 9 von 10 Treffern. Gezeigt werden deine Märkte.</p>
      <div class="table-wrap"><table class="t"><thead><tr><th>Anlage</th><th>in 30 Tagen</th><th>in 90 Tagen</th><th>in 1 Jahr</th></tr></thead>
        <tbody><template x-for="(m, a) in meth" :key="a"><tr><td><i class="dot" :style="'background:' + col(a)"></i> <span x-text="m.name"></span></td>
          <template x-for="d in [30, 90, 365]" :key="d"><td x-text="covText(m, d)"></td></template></tr></template></tbody></table></div>
    </div>
    <div class="card">
      <h2>Kann man die Richtung vorhersagen?</h2>
      <p class="ink2">Getestet werden Rechenmodelle, die sagen wollen, ob ein Kurs steigt oder fällt. Darunter sind „Momentum“ (was gestiegen ist, steigt weiter), die 200-Tage-Linie (Durchschnittskurs der letzten 200 Tage) und ein lernendes Computermodell. Ein Modell zählt nur, wenn es nach Gebühren klar öfter richtig liegt als die einfache Regel „steigt immer“.</p>
      <div class="table-wrap"><table class="t"><thead><tr><th>Anlage</th><th>Zeitraum</th><th>„Steigt immer“ traf</th><th>Bestes Modell</th><th>traf</th><th>Besser?</th></tr></thead>
        <tbody><template x-for="row in dirRows()" :key="row.k"><tr><td x-text="row.name"></td><td x-text="row.days + ' Tage'"></td><td x-text="num(row.base * 100, 0) + ' %'"></td><td x-text="row.best"></td><td x-text="num(row.best_hit * 100, 0) + ' %'"></td><td x-text="row.approved ? 'ja' : 'nein'"></td></tr></template></tbody></table></div>
    </div>
    <div class="card faq">
      <h2>Begriffe einfach erklärt</h2>
      <p class="ink2">Tipp auf einen Begriff, um die Erklärung zu öffnen.</p>
      <h3 class="section">Grundlagen</h3>
      <details><summary>Anlage / Geldanlage</summary><p>Alles, worin du Geld steckst, damit es mehr wird, zum Beispiel ETFs, Aktien, Gold oder Tagesgeld. Kaufst du für 1.000 € Gold, ist das deine Anlage.</p></details>
      <details><summary>Kurs</summary><p>Der aktuelle Preis einer Anlage. Er ändert sich, solange die Börse offen ist, oft im Minutentakt. Kostet ein ETF-Anteil heute 100 € und morgen 101 €, ist sein Kurs um 1 % gestiegen.</p></details>
      <details><summary>Börse</summary><p>Ein Marktplatz, auf dem Aktien, ETFs und andere Anlagen gekauft und verkauft werden. Heute läuft das fast nur per Computer: Du gibst deiner Bank den Auftrag, sie kauft für dich an der Börse.</p></details>
      <details><summary>Depot</summary><p>Das Konto, auf dem deine Aktien und ETFs liegen. Du eröffnest es bei deiner Bank oder bei einem Online-Broker (einer Bank fürs Anlegen im Internet), oft kostenlos.</p></details>
      <details><summary>Sparplan</summary><p>Jeden Monat wird automatisch ein fester Betrag angelegt, zum Beispiel 100 € in einen ETF. Du musst dich um nichts kümmern und kaufst mal teurer, mal günstiger ein.</p></details>
      <details><summary>Wertzuwachs / Rendite</summary><p>Um wie viel Prozent eine Anlage pro Jahr im Schnitt mehr wert wird. 7 % Rendite heißt: Aus 1.000 € werden nach einem Jahr etwa 1.070 €.</p></details>
      <details><summary>Zinseszins</summary><p>Gewinne bringen selbst wieder Gewinne, deshalb wächst Geld über lange Zeit immer schneller. Bei 7 % im Jahr werden aus 10.000 € nach 10 Jahren etwa 19.700 €, nach 20 Jahren schon etwa 38.700 €.</p></details>
      <details><summary>Inflation</summary><p>Preise steigen, dasselbe Geld kauft später weniger. Bei 2 % im Jahr kaufen 100 € in 10 Jahren nur noch so viel wie heute 82 €.</p></details>
      <details><summary>In heutigem Geld</summary><p>Beträge aus der Zukunft sind um die Inflation bereinigt, damit du sie mit heutigen Preisen vergleichen kannst. Bei 2 % Inflation sind 12.190 € in 10 Jahren so viel wert wie heute 10.000 €.</p></details>
      <details><summary>Notgroschen</summary><p>Etwa 3 Monatsausgaben auf dem Tagesgeldkonto, für ein kaputtes Auto, eine neue Waschmaschine oder einen Jobverlust. Gibst du 2.000 € im Monat aus, sind das 6.000 €. Erst wenn er steht, lohnt sich das Anlegen.</p></details>
      <details><summary>Tagesgeld</summary><p>Ein Sparkonto mit Zinsen, an das du jederzeit herankommst. Bis 100.000 € pro Bank ist dein Geld gesetzlich abgesichert. Deshalb ist es der richtige Ort für den Notgroschen.</p></details>
      <h3 class="section">Anlagen</h3>
      <details><summary>Aktie</summary><p>Ein kleiner Anteil an einer Firma. Verdient die Firma gut, steigt meist der Kurs, oft gibt es zusätzlich eine jährliche Gewinnbeteiligung (Dividende). Mit einer Siemens-Aktie gehört dir ein winziges Stück von Siemens.</p></details>
      <details><summary>Index</summary><p>Eine Liste von Firmen, deren Kurse zusammen gemessen werden. Der DAX zum Beispiel enthält 40 große deutsche Firmen. Steigt der DAX um 1 %, sind diese Firmen im Schnitt 1 % mehr wert.</p></details>
      <details><summary>ETF</summary><p>Ein Korb mit vielen Aktien auf einmal, den du an der Börse kaufst (Abkürzung für „Exchange Traded Fund“). Er bildet einen Index nach, die laufenden Kosten liegen meist bei 0,1–0,3 % im Jahr. Mit einem Welt-ETF für 100 € besitzt du kleine Stücke von über 1.000 Firmen.</p></details>
      <details><summary>MSCI World</summary><p>Ein Index der Firma MSCI mit rund 1.400 großen Firmen aus 23 Industrieländern, etwa Apple, Nestlé und Siemens. Etwa 70 % davon sind US-Firmen. Ein ETF darauf gilt bei vielen als einfacher Einstieg.</p></details>
      <details><summary>Fonds</summary><p>Ein großer Geldtopf, in den viele Anleger einzahlen und den eine Fondsgesellschaft für sie anlegt. Ein ETF ist ein Fonds, der einfach einen Index nachbildet und deshalb günstig ist. Fonds mit eigenem Verwalter kosten oft 1–2 % im Jahr.</p></details>
      <details><summary>Anleihe</summary><p>Ein Kredit, den du einem Staat oder einer Firma gibst. Dafür bekommst du Zinsen und am Ende dein Geld zurück. Anleihen schwanken meist weniger als Aktien, bringen langfristig aber meist auch weniger.</p></details>
      <details><summary>Bitcoin / Krypto</summary><p>Digitales Geld ohne Bank dahinter. Der Kurs schwankt sehr stark: In der Vergangenheit fiel Bitcoin mehrfach um mehr als die Hälfte. Leg nur Geld an, dessen Verlust du verkraften kannst.</p></details>
      <h3 class="section">Risiko und Mischung</h3>
      <details><summary>Schwankung</summary><p>Wie stark der Kurs typischerweise hoch und runter geht. „±8 % pro Monat“ heißt: In etwa 2 von 3 Monaten bewegt sich der Kurs um weniger als 8 %, bei 1.000 € also um weniger als 80 €.</p></details>
      <details><summary>Absturz vom Hoch</summary><p>Wie weit ein Kurs unter seinem bisherigen Höchststand liegt. War ein ETF-Anteil einmal 100 € wert und kostet jetzt 70 €, liegt er 30 % unter dem Hoch. Wichtig ist auch, wie lange es dauert, bis das alte Hoch wieder erreicht ist.</p></details>
      <details><summary>Streuen</summary><p>Geld auf viele Anlagen verteilen, damit ein Absturz nicht alles trifft. Steckt alles in einer Firma und sie geht pleite, ist das Geld weg. In einem ETF mit 1.400 Firmen merkst du so eine Pleite kaum.</p></details>
      <details><summary>Mischung</summary><p>Wie dein Geld auf Anlagen verteilt ist, zum Beispiel 70 % Welt-ETF und 30 % Tagesgeld. Je mehr Aktien in der Mischung, desto mehr Wertzuwachs ist möglich, desto stärker schwankt sie aber auch.</p></details>
      <details><summary>Umschichten</summary><p>Ab und zu zurück zur geplanten Mischung. Beispiel: Aus 70 % ETF und 30 % Tagesgeld sind durch Kursgewinne 80 zu 20 geworden. Dann verkaufst du etwas vom ETF und füllst das Tagesgeld wieder auf.</p></details>
      <details><summary>Marktphase</summary><p>Eine grobe Einteilung, wie sich ein Markt gerade verhält: ruhig steigend, unruhig oder fallend. Sie beschreibt nur die Lage und sagt nicht voraus, wie es weitergeht.</p></details>
      <h3 class="section">Kosten und Steuern</h3>
      <details><summary>Laufende Kosten</summary><p>Was ein ETF oder Fonds jedes Jahr von deinem Geld abzieht (Fachwort: TER, „Total Expense Ratio“). 0,2 % im Jahr sind bei 10.000 € etwa 20 €. Du zahlst das nicht extra, es steckt schon im Kurs.</p></details>
      <details><summary>Abgeltungsteuer</summary><p>Steuer auf Gewinne aus Geldanlagen, rund 26 % (25 % plus Solidaritätszuschlag, ggf. Kirchensteuer). Deine Bank zieht sie automatisch ab. Von 1.000 € Gewinn über dem Freibetrag gehen bei Aktien also etwa 264 € ans Finanzamt.</p></details>
      <details><summary>Freibetrag</summary><p>1.000 € Gewinn pro Jahr bleiben steuerfrei, für Ehepaare 2.000 € (Fachwort: Sparerpauschbetrag). Dafür stellst du bei deiner Bank einen Freistellungsauftrag, meist mit ein paar Klicks im Online-Banking.</p></details>
      <details><summary>Kirchensteuer</summary><p>Bist du Mitglied einer Kirche, kommen auf die Abgeltungsteuer noch 8 % (Bayern, Baden-Württemberg) oder 9 % (andere Bundesländer) obendrauf. Die Bank zieht sie automatisch mit ab.</p></details>
      <details><summary>Persönlicher Steuersatz</summary><p>Der Steuersatz auf jeden zusätzlichen Euro deines Einkommens (Fachwort: Grenzsteuersatz), bei normalem Einkommen meist 25–42 %. Er gilt zum Beispiel, wenn du Gold, Silber oder Krypto schon innerhalb eines Jahres mit Gewinn verkaufst.</p></details>
      <details><summary>Steuerfrei nach einem Jahr</summary><p>Gold und Silber (Münzen, Barren, Schmuck) sowie Krypto sind in Deutschland nach mehr als einem Jahr Besitz steuerfrei. Verkaufst du früher, zahlst du deinen persönlichen Steuersatz, wenn alle solchen Gewinne im Jahr zusammen 1.000 € oder mehr ergeben.</p></details>
      <h3 class="section">Gold &amp; Silber</h3>
      <details><summary>Spotpreis und Materialwert</summary><p>Der Spotpreis ist der aktuelle Börsenpreis für reines Gold oder Silber. Der Materialwert deiner Münze oder Kette ist Feingewicht × Spotpreis, also was das reine Metall wert ist. Händler zahlen beim Ankauf meist 2–10 % weniger, bei Schmuck oft deutlich weniger.</p></details>
      <details><summary>Feinheit (z. B. 585)</summary><p>Die Feinheit sagt, wie viel Tausendstel reines Metall enthalten sind. 585 heißt 58,5 % Gold, eine Kette mit 10 g enthält also 5,85 g reines Gold. Die Zahl ist meist eingestempelt: 999 bei Barren, 585 oder 333 bei Goldschmuck, 925 bei Silber.</p></details>
      <details><summary>Feinunze</summary><p>Die übliche Gewichtseinheit für Edelmetall: 1 Feinunze sind 31,1 g reines Metall. Bekannte Münzen wie Krügerrand oder Maple Leaf enthalten genau 1 Feinunze Gold.</p></details>
      <h3 class="section">So rechnet das Tool</h3>
      <details><summary>Prognose</summary><p>Eine Schätzung, was aus deinem Geld werden kann. Hier ist sie immer eine Spanne, nie eine genaue Vorhersage, denn niemand kennt die Zukunft.</p></details>
      <details><summary>Verläufe durchspielen</summary><p>Das Tool rechnet tausende mögliche Zukünfte aus echten Kursen der Vergangenheit durch (Fachwort: Monte-Carlo-Simulation). Dafür setzt es echte Abschnitte von je 20 Börsentagen zufällig neu zusammen. Am Ende zählt es, wie oft welches Ergebnis herauskommt.</p></details>
      <details><summary>Spanne</summary><p>Der Bereich, in dem das Ergebnis in 9 von 10 Fällen landet. „Zwischen 9.000 € und 20.000 €“ heißt: Nur 1 von 20 Verläufen endete darunter und 1 von 20 darüber.</p></details>
      <details><summary>Mittlerer Verlauf</summary><p>Die Hälfte der durchgespielten Verläufe endet darüber, die Hälfte darunter. Er ist kein Versprechen, sondern die Mitte aller Möglichkeiten.</p></details>
      <details><summary>Datenquellen</summary><p>Kurse: Binance und Yahoo Finance (alle 5 Minuten), Spotpreise von gold-api.com. Wechselkurse: Europäische Zentralbank. Inflation: Eurostat (HVPI, die amtlich gemessene Preissteigerung in Europa).</p></details>
    </div>
  </div>
  </template>
</section>
</main>
<footer class="foot">
  Keine Anlageberatung. Prognosen sind Spannen auf Basis der Vergangenheit, keine Garantie. · <a href="#/methodik">Wie rechnet das Tool?</a> · <span x-text="statusText"></span>
</footer>

<!-- ---------- KI-Ratgeber ---------- -->
<button class="fab" x-show="aiVisible() && !chat.open" @click="openChat()" title="KI-Ratgeber fragen" aria-label="KI-Ratgeber fragen">💬 <span>Ratgeber fragen</span></button>
<aside class="chat" x-show="chat.open" x-transition.opacity @keydown.escape.window="chat.open = false">
  <div class="chat-head">
    <div><b>KI-Ratgeber</b><small x-text="chat.model ? ' · ' + chat.model : ''"></small></div>
    <div class="row" style="gap:4px"><button class="small ghost" @click="clearChat()" title="Neues Gespräch">Neu</button><button class="small ghost" @click="chat.open = false" title="Schließen">✕</button></div>
  </div>
  <div class="chat-body" x-ref="chatBody">
    <template x-if="!chat.ready && chat.reason">
      <div class="notice"><span x-text="chat.reason"></span> <a href="#/einstellungen" @click="chat.open = false">Zu den Einstellungen →</a></div>
    </template>
    <template x-if="chat.ready && !chat.msgs.length">
      <div class="chat-hello">
        <p>Hallo <span x-text="me.name"></span>! Ich bin dein KI-Ratgeber und kenne deinen Bestand, deine Ziele und alle Rechner. Frag mich alles rund um Geld, ich erkläre es in einfachen Worten.</p>
        <div class="chips"><template x-for="q in chatSuggestions()" :key="q"><button class="small" @click="send(q)" x-text="q"></button></template></div>
      </div>
    </template>
    <template x-for="(m, i) in chat.msgs" :key="i">
      <div class="msg" :class="m.role">
        <div class="bubble" x-html="m.role === 'assistant' ? md(m.content) : escapeHtml(m.content)"></div>
        <template x-for="e in m.events || []" :key="e"><div class="msg-ev" x-text="e"></div></template>
      </div>
    </template>
    <div class="msg-status" x-show="chat.status" x-text="chat.status"></div>
  </div>
  <form class="chat-input" @submit.prevent="send()">
    <textarea rows="1" x-model="chat.input" x-ref="chatInput" placeholder="Frag etwas …" @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); send(); }" :disabled="!chat.ready" maxlength="4000"></textarea>
    <button class="primary" type="submit" :disabled="chat.busy || !chat.ready || !chat.input.trim()">➤</button>
  </form>
  <div class="chat-foot">KI kann sich irren. Keine Anlageberatung.</div>
</aside>

<template x-if="hf">

    <template x-if="!hf.id && !hf.asset">
      <div style="margin-top:14px">
        <div class="tabs"><template x-for="k in kindTabs()" :key="k.id"><button class="small" :class="hf.kind === k.id && 'sel'" @click="hf.kind = k.id; hf.q = ''" x-text="k.label"></button></template></div>
        <input type="search" placeholder="Suchen …" x-model="hf.q" style="margin-bottom:10px" x-show="assetsOfKind(hf.kind).length > 6">
        <div class="choice"><template x-for="a in assetsOfKind(hf.kind, hf.q)" :key="a"><button @click="hf.asset = a; hfDefaults()"><i class="dot" :style="'background:' + col(a)"></i><span x-text="assetName(a)"></span></button></template></div>
        <p class="hint" style="margin-top:10px">Nicht dabei? Unter <a href="#/maerkte" @click="hf = null">Märkte</a> kannst du jede Aktie, jeden ETF oder jede Kryptowährung hinzufügen.</p>
      </div>
    </template>
    <template x-if="hf.asset">
      <div class="row" style="margin-top:12px"><i class="dot" :style="'background:' + col(hf.asset)"></i><b x-text="assetName(hf.asset)"></b><button class="small ghost" x-show="!hf.id" @click="hf.asset = null; hfInfo = null">ändern</button></div>
    </template>
    <template x-if="hf.asset && isMetal(hf.asset)">
      <div style="margin-top:16px">
        <label class="f"><span class="t">Form</span>
          <div class="seg"><template x-for="f in [['coin','Münze'],['bar','Barren'],['jewelry','Schmuck'],['other','Sonstiges']]" :key="f[0]"><button type="button" class="small" :class="hf.form === f[0] && 'sel'" @click="hf.form = f[0]; if (f[0] === 'coin' && !hf.coin) hf.coin = (meta.coins[hf.asset] || [{}])[0].id; hfPreview()" x-text="f[1]" x-show="f[0] !== 'coin' || (meta.coins[hf.asset] || []).length"></button></template></div></label>
        <template x-if="hf.form === 'coin'">
          <div class="grid g2">
            <label class="f"><span class="t">Münze</span><select x-model="hf.coin" @change="hfPreview()"><template x-for="c in meta.coins[hf.asset]" :key="c.id"><option :value="c.id" x-text="c.name" :selected="c.id === hf.coin"></option></template></select></label>
            <label class="f" x-show="coinHasSizes()"><span class="t">Größe</span><select x-model.number="hf.weight" @change="hfPreview()"><template x-for="s in meta.coin_sizes" :key="s.value"><option :value="s.value" x-text="s.label" :selected="s.value == hf.weight"></option></template></select></label>
          </div>
        </template>
        <template x-if="hf.form !== 'coin'">
          <div class="grid g3">
            <label class="f"><span class="t">Gewicht <button type="button" class="help" @click="toggleHelp('h_hf_weight')">?</button></span>
              <div class="help-box" x-show="help.h_hf_weight">Das Gesamtgewicht des Stücks. Bei Barren steht es eingeprägt, bei Schmuck hilft eine genaue Küchen- oder Briefwaage.</div>
              <input type="number" min="0" step="any" x-model.number="hf.weight" @input="hfPreview()"></label>
            <label class="f"><span class="t">Einheit</span><select x-model="hf.unit" @change="hfPreview()"><option value="g">Gramm</option><option value="oz">Feinunze (31,1 g)</option><option value="kg">Kilo</option></select></label>
            <label class="f"><span class="t">Feinheit <button type="button" class="help" @click="toggleHelp('h_hf_fine')">?</button></span>
              <div class="help-box" x-show="help.h_hf_fine">Wie viel Tausendstel reines Metall drin sind, meist als kleiner Stempel eingeprägt. 999 ist fast rein (Barren, viele Münzen), 585 heißt 58,5 % Gold. Weißt du es nicht: Bei Goldschmuck ist 585 häufig, bei Silberschmuck 925.</div>
              <select x-model.number="hf.fineness" @change="hfPreview()"><template x-for="f in meta.fineness[hf.asset]" :key="f.value"><option :value="f.value" x-text="fineShort(f)" :selected="f.value == hf.fineness"></option></template></select></label>
          </div>
        </template>
        <div class="grid g2">
          <label class="f"><span class="t">Anzahl</span><input type="number" min="1" step="1" x-model.number="hf.count" @input="hfPreview()"></label>
          <label class="f"><span class="t">Bezeichnung (freiwillig)</span><input x-model="hf.label" maxlength="60" :placeholder="hf.form === 'jewelry' ? 'z. B. Kette von Oma' : 'z. B. Schließfach'"></label>
        </div>
      </div>
    </template>
    <template x-if="hf.asset && !isMetal(hf.asset)">
      <div style="margin-top:16px">
        <label class="f"><span class="t"><span x-text="'Wie viele ' + meta.assets[hf.asset].units + '?'"></span> <button type="button" class="help" @click="toggleHelp('h_hf_qty')">?</button></span>
          <div class="help-box" x-show="help.h_hf_qty">Die Stückzahl steht in deinem Depot (Konto für Aktien und ETFs), meist in der Spalte „Stück“ oder „Bestand“, bei Krypto in deiner App. Kommastellen sind normal, zum Beispiel 12,5 Anteile durch einen Sparplan.</div>
          <input type="number" min="0" step="any" x-model.number="hf.quantity" @input="hfPreview()" :placeholder="meta.assets[hf.asset].kind === 'crypto' ? 'z. B. 0,05' : 'z. B. 12,5'">
          <div class="hint" x-text="'Gerechnet wird mit dem Kurs von ' + meta.assets[hf.asset].symbol + '. ' + (meta.assets[hf.asset].kind === 'etf' ? 'Hast du einen anderen ETF auf denselben Index (dieselbe Firmenliste), passt das trotzdem: Er entwickelt sich fast gleich.' : '')"></div></label>
        <label class="f"><span class="t">Bezeichnung (freiwillig)</span><input x-model="hf.label" maxlength="60" placeholder="z. B. Depot bei der Hausbank"></label>
      </div>
    </template>
    <template x-if="hf.asset">
      <div>
        <div class="grid g2">
          <label class="f"><span class="t">Kaufdatum (freiwillig)</span><input type="date" x-model="hf.buy_date" @change="hfPreview()" max="9999-12-31">
            <div class="hint">Ungefähr reicht.</div></label>
          <label class="f"><span class="t">Bezahlt insgesamt (freiwillig) <button type="button" class="help" @click="toggleHelp('h_hf_price')">?</button></span>
            <div class="help-box" x-show="help.h_hf_price">Was du damals insgesamt bezahlt hast, mit Gebühren. Es steht auf der Rechnung oder der Kaufabrechnung der Bank. Weißt du es nicht, lass das Feld leer.</div>
            <div class="suffix"><input type="number" min="0" step="any" x-model="hf.buy_price"><span x-text="curSym()"></span></div>
            <div class="hint" x-show="hf.buy_date && hfInfo && hfInfo.then"><a href="#" @click.prevent="hf.buy_price = Math.round(hfInfo.then)" x-text="'Wert am Kaufdatum übernehmen: ' + money(hfInfo && hfInfo.then)"></a></div></label>
        </div>
        <div class="ok-box" x-show="hfInfo && hfInfo.now" x-text="hfInfo ? hfInfo.text : ''"></div>
        <div class="err" style="margin-top:10px" x-show="hf.err" x-text="hf.err"></div>
        <div class="row" style="margin-top:14px"><button class="primary" @click="saveHolding()">Speichern</button><button class="ghost" @click="hf = null">Abbrechen</button></div>
      </div>
    </template>
  </div>
</div>
</template>

<template x-if="plf">

    <label class="f" style="margin-top:14px"><span class="t">Worin?</span>
      <select x-model="plf.asset"><template x-for="k in marketGroups()" :key="k.id"><optgroup :label="k.label"><template x-for="a in k.items" :key="a"><option :value="a" x-text="assetName(a)" :selected="a === plf.asset"></option></template></optgroup></template></select>

      <label class="f"><span class="t">Betrag pro Monat</span><input type="number" min="1" step="any" x-model.number="plf.amount"></label>

    </div>
    <div class="err" x-show="plf.err" x-text="plf.err"></div>
    <div class="row" style="margin-top:14px"><button class="primary" @click="savePlan()">Speichern</button><button class="ghost" @click="plf = null">Abbrechen</button></div>
  </div>
</div>
</template>

<!-- ---------- Dialog: Ziel ---------- -->
<template x-if="gf">
<div class="modal-bg" @click.self="gf = null" @keydown.escape.window="gf = null">
  <div class="modal">
    <div class="row between"><h2 style="margin:0" x-text="gf.id ? 'Ziel ändern' : 'Neues Ziel'"></h2><button class="ghost small" @click="gf = null">Schließen</button></div>
    <label class="f" style="margin-top:14px"><span class="t">Wofür?</span><select x-model="gf.purpose"><template x-for="(lbl, k) in meta.goal_purposes" :key="k"><option :value="k" x-text="lbl" :selected="k === gf.purpose"></option></template></select></label>
    <label class="f"><span class="t">Name</span><input x-model="gf.name" maxlength="60" placeholder="z. B. Auto"></label>
    <div class="grid g2">
      <label class="f"><span class="t">Betrag</span><div class="suffix"><input type="number" min="0" step="500" x-model.number="gf.amount"><span x-text="curSym()"></span></div></label>
      <label class="f"><span class="t">In wie vielen Jahren?</span><input type="number" min="0.5" max="60" step="0.5" x-model.number="gf.years"></label>
    </div>
    <div class="err" x-show="gf.err" x-text="gf.err"></div>
    <div class="row" style="margin-top:14px"><button class="primary" @click="saveGoal()">Speichern</button><button class="ghost" @click="gf = null">Abbrechen</button></div>
  </div>
</div>
</template>
<div class="toast" x-show="toast" x-transition x-text="toast"></div>
</div>
</template>
</body>
</html>
