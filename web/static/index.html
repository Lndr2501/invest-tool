<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invest-Ratgeber</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b43c4'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/style.css?v=5">
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js?v=6"></script>
<script src="/static/pages.js?v=7"></script>
<script src="/static/calc.js?v=6"></script>
<script src="/static/charts.js?v=6"></script>
<script src="/static/chat.js?v=6"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

<!-- ================= Anmeldung ================= -->
<template x-if="ready && !me">
<main class="login-wrap">
  <div class="row" style="gap:10px;margin-bottom:22px">
    <div class="brand-mark" style="width:40px;height:40px;font-size:22px">↗</div>
    <div><h1 style="margin:0">Invest-Ratgeber</h1><div class="muted">Geld verstehen, planen und anlegen, in einfachen Worten</div></div>
  </div>
  <div class="card" x-show="!login.creating">
    <h2>Wer bist du?</h2>
    <p class="ink2">Jedes Profil hat eigene Ziele, einen eigenen Bestand und einen eigenen Bericht aufs Handy (per Telegram).</p>
    <div class="profiles">
      <template x-for="p in profiles" :key="p.id">
        <button @click="pickProfile(p)" :class="login.sel && login.sel.id === p.id ? 'sel' : ''">
          <span class="avatar" x-text="initials(p.name)"></span>
          <span x-text="p.name"></span>
          <small x-show="p.has_pin">🔒 mit PIN</small>
        </button>
      </template>
      <button @click="login.creating = true; login.err = ''"><span class="avatar">+</span><span>Neues Profil</span></button>
    </div>
    <template x-if="login.sel && login.sel.has_pin">
      <form class="row" style="margin-top:16px" @submit.prevent="doLogin()">
        <input type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" x-model="login.pin" style="max-width:180px" x-ref="pin">
        <button class="primary" type="submit">Öffnen</button>
      </form>
    </template>
    <div class="err" style="margin-top:12px" x-show="login.err" x-text="login.err"></div>
  </div>
  <div class="card" x-show="login.creating">
    <h2>Neues Profil</h2>
    <form @submit.prevent="createProfile()">
      <label class="f"><span class="t">Name</span><input x-model="login.name" maxlength="30" placeholder="z. B. Alex" required></label>
      <label class="f"><span class="t">Währung</span>
        <select x-model="login.currency"><template x-for="(c, k) in meta.currencies" :key="k"><option :value="k" x-text="k + ' – ' + c.name"></option></template></select>
        <div class="hint">In dieser Währung zeigt das Tool alle Beträge. Du kannst sie später ändern.</div></label>
      <label class="f"><span class="t">PIN (freiwillig)</span>
        <input type="password" inputmode="numeric" autocomplete="new-password" x-model="login.newpin" placeholder="4–12 Ziffern, leer = ohne PIN">
        <div class="hint">Ein Zahlencode wie beim Handy. Ohne PIN kann jeder in deinem Heimnetz (WLAN zu Hause) dein Profil öffnen.</div></label>
      <div class="err" style="margin-bottom:12px" x-show="login.err" x-text="login.err"></div>
      <div class="row"><button class="primary" type="submit">Profil anlegen</button><button type="button" class="ghost" @click="login.creating = false">Zurück</button></div>
    </form>
  </div>
  <p class="muted" style="margin-top:18px;font-size:.85rem">Keine Anlageberatung. Alle Prognosen sind Spannen, berechnet aus der Vergangenheit, und keine Garantie.</p>
</main>
</template>

<!-- ================= App ================= -->
<template x-if="ready && me">
<div>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/ueberblick"><span class="brand-mark">↗</span><span>Invest-Ratgeber</span></a>
    <nav class="main">
      <template x-for="n in nav" :key="n[0]"><a :href="'#/' + n[0]" :class="navOn(n[0]) && 'on'" x-text="n[1]"></a></template>
    </nav>
    <div class="who">
      <span class="avatar" x-text="initials(me.name)"></span><span class="name" x-text="me.name"></span>
      <button class="small ghost" @click="logout()" title="Profil wechseln">Wechseln</button>
    </div>
  </div>
</header>

<main>
<!-- ---------- Überblick ---------- -->
<section x-show="route === 'ueberblick'">
  <template x-if="ov">
  <div>
    <div class="page-head">
      <h1 x-text="'Hallo ' + me.name"></h1>
      <p class="lead" x-text="ov.headline.join(' ')"></p>
    </div>

    <div class="ov-top" :class="!ovNext().length && 'single'">
      <div class="card money-card">
        <template x-if="!ov.portfolio.empty">
          <div>
            <div class="label">Dein Bestand heute</div>
            <div class="big" x-text="money(ov.portfolio.total)"></div>
            <p class="ink2" style="margin:8px 0 0">
              <span x-show="ov.portfolio.change['7d']">Letzte 7 Tage: <b :class="cls(ov.portfolio.change['7d'] && ov.portfolio.change['7d'].pct) + '-t'" x-text="pct(ov.portfolio.change['7d'] && ov.portfolio.change['7d'].pct)"></b>.</span>
              <span x-show="ov.portfolio.gain !== null"> Seit dem Kauf: <b :class="cls(ov.portfolio.gain) + '-t'" x-text="signMoney(ov.portfolio.gain)"></b>.</span>
            </p>
            <div style="margin-top:14px">
              <div class="alloc-bar"><template x-for="a in ov.portfolio.alloc" :key="a.asset"><div :style="'width:' + (a.share * 100) + '%;background:' + col(a.asset)" :title="a.name"></div></template></div>
              <div class="legend" style="margin-top:8px"><template x-for="a in ov.portfolio.alloc.slice(0, 5)" :key="a.asset"><span><i class="dot" :style="'background:' + col(a.asset)"></i><span x-text="a.name + ' ' + num(a.share * 100, 0) + ' %'"></span></span></template></div>
            </div>
            <a class="more" href="#/bestand">Zum Bestand →</a>
          </div>
        </template>
        <template x-if="ov.portfolio.empty">
          <div>
            <div class="label">Dein Bestand</div>
            <div class="mid" style="margin:4px 0 8px">Du hast noch nichts angelegt</div>
            <p class="ink2">Kein Problem, die meisten fangen mit einem kleinen Betrag pro Monat an. In 5 kurzen Fragen bekommst du einen ersten Plan.</p>
            <div class="row"><a class="btn primary" href="#/start">Plan in 5 Fragen</a><a class="btn" href="#/bestand?add=1">Ich habe schon etwas</a></div>
          </div>
        </template>
      </div>

      <template x-if="ovNext().length">
        <div class="card next-card">
          <div class="label">Dein nächster Schritt</div>
          <h3 x-text="ovNext()[0].title"></h3>
          <p x-text="ovNext()[0].text"></p>
          <a class="btn primary" :href="ovNext()[0].link" x-text="ovNext()[0].action"></a>
          <details class="more-ideas" x-show="ovNext().length > 1">
            <summary x-text="'Weitere Ideen (' + (ovNext().length - 1) + ')'"></summary>
            <template x-for="n in ovNext().slice(1)" :key="n.title"><a class="idea" :href="n.link"><b x-text="n.title"></b><span x-text="n.text"></span></a></template>
          </details>
        </div>
      </template>
    </div>

    <template x-if="ov.goal">
      <div class="card goal-card section">
        <div class="row between"><div class="label">Dein Ziel</div>
          <span class="chip" :class="ov.goal.on_track === true ? 'up' : ov.goal.on_track === false ? 'down' : ''" x-text="ov.goal.on_track === true ? 'im Plan' : ov.goal.on_track === false ? 'reicht noch nicht' : 'Sparrate fehlt'"></span></div>
        <p style="margin:6px 0 0" x-text="ov.goal.text"></p>
        <a class="more" href="#/ziele" x-text="ov.goal.count > 1 ? 'Alle ' + ov.goal.count + ' Ziele →' : 'Ziel ansehen →'"></a>
      </div>
    </template>

    <div class="section">
      <div class="row between"><h2 style="margin:0">Deine Märkte</h2><a href="#/maerkte">Alle Märkte →</a></div>
      <p class="muted" style="font-size:.9rem;margin:4px 0 10px">Aktuelle Kurse (Preise) in deiner Einheit. Die Zahl rechts zeigt die Veränderung der letzten 7 Tage.</p>
      <div class="card list">
        <template x-for="m in ov.markets" :key="m.asset">
          <a class="mrow" :href="'#/maerkte/' + m.asset">
            <i class="dot" :style="'background:' + col(m.asset)"></i>
            <div class="mrow-main"><b x-text="m.short"></b><small x-text="m.line"></small></div>
            <div class="mrow-price"><b x-text="m.text"></b><small x-text="m.label"></small></div>
            <div class="mrow-ch"><span class="chip" :class="cls(m.change['7d'])" x-text="pct(m.change['7d'])"></span></div>
          </a>
        </template>
        <div class="muted" x-show="!ov.markets.length" style="padding:10px 0">Du beobachtest noch keine Märkte. <a href="#/maerkte">Märkte auswählen →</a></div>
      </div>
    </div>

    <div class="section card ask-card" x-show="aiVisible()">
      <h3>Frag den Ratgeber</h3>
      <p class="ink2" style="font-size:.93rem">Der KI-Ratgeber (ein Chat mit künstlicher Intelligenz) kennt deinen Bestand, deine Ziele und alle Rechner. Er erklärt alles in einfachen Worten, kann sich aber irren.</p>
      <div class="chips"><template x-for="q in askChips.ueberblick" :key="q"><button class="small" @click="ask(q)" x-text="q"></button></template></div>
    </div>
  </div>
  </template>
</section>

<!-- ---------- Start-Assistent ---------- -->
<section x-show="route === 'start'">
  <div class="wizard">
    <div class="page-head"><h1>Dein erster Plan</h1><p>Fünf kurze Fragen. Danach weißt du, in welcher Reihenfolge du vorgehst, wie viel im Monat sinnvoll ist und was daraus werden kann.</p></div>
    <div class="steps-dots" x-show="wz.step <= 5"><template x-for="i in 5" :key="i"><i :class="i < wz.step ? 'done' : i === wz.step ? 'on' : ''"></i></template><span x-text="'Frage ' + wz.step + ' von 5'"></span></div>

    <div class="card" x-show="wz.step === 1">
      <h2>Wofür möchtest du sparen?</h2>
      <div class="pick">
        <template x-for="p in purposeList()" :key="p[0]"><button :class="wz.a.purpose === p[0] && 'sel'" @click="wz.a.purpose = p[0]; wz.a.name = wz.a.name || p[2]"><span class="ic" x-text="p[3]"></span><span x-text="p[1]"></span></button></template>
      </div>
      <label class="f" style="margin-top:14px"><span class="t">Name für dein Ziel (freiwillig)</span><input x-model="wz.a.name" maxlength="60" placeholder="z. B. Neues Auto"></label>
      <div class="row end"><button class="primary" :disabled="!wz.a.purpose" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 2">
      <h2>Wann brauchst du das Geld?</h2>
      <p class="ink2">Das ist die wichtigste Frage. Je länger das Geld liegen bleiben kann, desto mehr Auf und Ab verträgt es, weil Zeit zum Erholen bleibt.</p>
      <div class="pick">
        <template x-for="h in horizons" :key="h[0]"><button :class="wz.a.years === h[0] && 'sel'" @click="wz.a.years = h[0]"><b x-text="h[1]"></b><small x-text="h[2]"></small></button></template>
      </div>
      <label class="f" style="margin-top:14px"><span class="t">Genauer: <span x-text="wz.a.years + ' Jahre'"></span></span><input type="range" min="1" max="40" x-model.number="wz.a.years"></label>
      <label class="f"><span class="t">Hast du einen Betrag im Kopf? (freiwillig)</span><div class="suffix"><input type="number" min="0" step="500" x-model.number="wz.a.amount" placeholder="z. B. 10000"><span x-text="curSym()"></span></div></label>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 3">
      <h2>Wie viel kannst du im Monat zur Seite legen?</h2>
      <label class="f"><span class="t">Betrag pro Monat <button type="button" class="help" @click="toggleHelp('h_wz_monthly')">?</button></span>
        <div class="help-box" x-show="help.h_wz_monthly">Nur so viel, wie auch in teuren Monaten sicher übrig bleibt. Lieber klein anfangen, etwa mit 50 €, und später erhöhen.</div>
        <div class="suffix"><input type="number" min="0" step="25" x-model.number="wz.a.monthly" placeholder="z. B. 100"><span x-text="curSym()"></span></div></label>
      <label class="check"><input type="checkbox" x-model="wz.helpIncome"><span>Weiß ich nicht, hilf mir beim Ausrechnen</span></label>
      <div x-show="wz.helpIncome" class="sub-box">
        <div class="grid g2">
          <label class="f"><span class="t">Netto-Einkommen im Monat</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.income"><span x-text="curSym()"></span></div>
            <div class="hint">Was nach Steuern und Abgaben auf dein Konto kommt</div></label>
          <label class="f"><span class="t">Ausgaben im Monat (alles)</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.expenses"><span x-text="curSym()"></span></div>
            <div class="hint">Miete, Strom, Handy, Versicherungen, Essen, Freizeit. Tipp: Kontoauszüge der letzten 3 Monate ansehen.</div></label>
        </div>
        <template x-if="wz.a.income > 0">
          <div class="ok-box" x-show="wz.a.income - (wz.a.expenses || 0) > 0">
            <span x-text="'Dir bleiben etwa ' + money(wz.a.income - (wz.a.expenses || 0)) + ' im Monat. Faustregel: rund 20 % vom Netto-Einkommen sparen, das wären ' + money(suggestSaving()) + '.'"></span>
            <button class="small" style="margin-left:8px" @click="wz.a.monthly = suggestSaving()">Übernehmen</button>
          </div>
        </template>
        <div class="notice" x-show="wz.a.income > 0 && wz.a.income - (wz.a.expenses || 0) <= 0">Deine Ausgaben sind mindestens so hoch wie dein Einkommen. Dann ist der erste Schritt, feste Kosten zu prüfen (Verträge, Abos, Versicherungen).</div>
      </div>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 4">
      <h2>Dein Polster für Notfälle</h2>
      <p class="ink2">Bevor du anlegst, brauchst du einen Notgroschen: etwa 3 Monatsausgaben, jederzeit verfügbar. Er fängt Überraschungen ab, etwa ein kaputtes Auto oder einen Jobverlust.</p>
      <label class="f"><span class="t">Wie viel hast du auf Konto/Tagesgeld? <button type="button" class="help" @click="toggleHelp('h_wz_cash')">?</button></span>
        <div class="help-box" x-show="help.h_wz_cash">Zähl Girokonto, Sparbuch und Tagesgeld zusammen. Tagesgeld ist ein Sparkonto mit Zinsen, an das du jederzeit herankommst. Bis 100.000 € pro Bank ist es gesetzlich abgesichert.</div>
        <div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.cash"><span x-text="curSym()"></span></div></label>
      <label class="f" x-show="!wz.a.expenses"><span class="t">Deine Ausgaben im Monat (ungefähr)</span><div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.expenses"><span x-text="curSym()"></span></div></label>
      <label class="f"><span class="t">Teure Schulden <button type="button" class="help" @click="toggleHelp('h_wz_debt')">?</button></span>
        <div class="help-box" x-show="help.h_wz_debt">Gemeint sind das Minus auf dem Girokonto (Dispo), Ratenkredite und offene Kreditkarten-Beträge. Sie kosten oft 10 % Zinsen im Jahr oder mehr. Das ist meist mehr, als eine Anlage bringt, deshalb zahlst du sie zuerst ab.</div>
        <div class="suffix"><input type="number" min="0" step="100" x-model.number="wz.a.debt" placeholder="0"><span x-text="curSym()"></span></div>
        <div class="hint">Dispo, Ratenkredit, Kreditkarte. Hauskredit oder BAföG zählen nicht.</div></label>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" @click="wzNext()">Weiter</button></div>
    </div>

    <div class="card" x-show="wz.step === 5">
      <h2>Was würdest du tun?</h2>
      <p class="ink2">Stell dir vor: Aus 10.000 € sind nach einem Jahr nur noch 7.000 € geworden, also 30 % weniger. Bei Aktien (Anteilen an Firmen) passiert das etwa alle 5 bis 10 Jahre.</p>
      <div class="pick one">
        <template x-for="r in reactions" :key="r[0]"><button :class="wz.a.reaction === r[0] && 'sel'" @click="wz.a.reaction = r[0]"><b x-text="r[1]"></b><small x-text="r[2]"></small></button></template>
      </div>
      <label class="f" style="margin-top:14px"><span class="t">Hast du schon Erfahrung mit Geldanlage?</span>
        <select x-model="wz.a.experience"><option value="none">Nein, gar nicht</option><option value="some">Ein bisschen</option><option value="much">Ja, viel</option></select></label>
      <div class="row between"><button class="ghost" @click="wz.step--">Zurück</button><button class="primary" :disabled="!wz.a.reaction || wz.busy" @click="wzFinish()" x-text="wz.busy ? 'Rechne …' : 'Plan anzeigen'"></button></div>
    </div>

    <template x-if="wz.step === 6 && wz.res">
      <div>
        <div class="card">
          <h2>So gehst du vor</h2>
          <ol class="plan-steps"><template x-for="s in wz.res.steps" :key="s.title"><li><b x-text="s.title"></b><span x-text="s.text"></span></li></template></ol>
        </div>
        <div class="card">
          <h2 x-text="wz.res.horizon === 'short' ? 'Wo das Geld hin sollte' : 'Eine passende Mischung'"></h2>
          <div class="alloc-bar big-bar"><template x-for="m in wz.res.mix" :key="m.key"><div :style="'width:' + m.pct + '%;background:' + mixCol(m)"></div></template></div>
          <template x-for="m in wz.res.mix" :key="m.key"><div class="mix-row"><i class="dot" :style="'background:' + mixCol(m)"></i><b x-text="m.pct + ' % ' + m.name"></b><span x-text="m.text"></span></div></template>
          <p class="muted" style="font-size:.85rem;margin-top:10px">Ein Vorschlag nach einfachen Regeln: wie lange das Geld liegen kann und wie viel Auf und Ab du aushältst. Keine Anlageberatung. Konkrete ETFs (Körbe mit vielen Aktien) findest du unter <a href="#/maerkte">Märkte</a>.</p>
        </div>
        <div class="card" x-show="wz.res.forecast || wz.res.goal_text">
          <h2>Was daraus werden kann</h2>
          <template x-if="wz.res.forecast">
            <div class="tiles t3">
              <div class="tile"><div class="label">Eingezahlt</div><div class="v" x-text="money(wz.res.forecast.invested)"></div></div>
              <div class="tile key"><div class="label">Mittlerer Verlauf</div><div class="v" x-text="money(wz.res.forecast.p50)"></div></div>
              <div class="tile"><div class="label">Schlechter Verlauf (1 von 20)</div><div class="v" x-text="money(wz.res.forecast.p5)"></div></div>
            </div>
          </template>
          <ul class="sentences"><li x-show="wz.res.forecast" x-text="wz.res.forecast && wz.res.forecast.text"></li><li x-show="wz.res.goal_text" x-text="wz.res.goal_text"></li></ul>
          <p class="muted" style="font-size:.85rem" x-show="wz.res.forecast">Das Tool hat tausende mögliche Zukünfte durchgespielt. Die Hälfte endet über dem mittleren Verlauf, nur 1 von 20 unter dem schlechten.</p>
        </div>
        <div class="card">
          <h2>Und jetzt?</h2>
          <div class="stack">
            <button class="primary wide" @click="wzSave()" :disabled="wz.saved" x-text="wz.saved ? '✓ In deinen Zielen gespeichert' : 'Plan als Ziel speichern'"></button>
            <a class="btn wide" :href="wzCalcLink()">Im Rechner mit echten Kursen genauer ansehen</a>
            <button class="wide" @click="openPlan(null, { asset: Object.keys(wz.res.weights)[0] || 'MSCIW', amount: wz.res.monthly })" x-show="wz.res.horizon !== 'short'">Ich spare schon so: Sparplan eintragen</button>
            <button class="wide" x-show="aiVisible()" @click="ask('Ich habe gerade den Start-Assistenten gemacht. Was hältst du von dem Plan, und was sollte ich als Erstes konkret tun?')">Mit dem KI-Ratgeber besprechen</button>
            <button class="ghost" @click="wzReset()">Noch mal von vorn</button>
          </div>
        </div>
      </div>
    </template>
  </div>
</section>

<!-- ---------- Mein Bestand ---------- -->
<section x-show="route === 'bestand'">
  <div class="page-head row between">
    <div><h1>Mein Bestand</h1><p>Trag ein, was du schon besitzt: Goldmünzen, Schmuck, Aktien (Anteile an Firmen), ETFs (Körbe aus vielen Aktien), Bitcoin oder Sparpläne. Dann siehst du jeden Tag, was alles zusammen wert ist.</p></div>
    <button class="primary" @click="openHolding()" x-show="pf && !pf.empty">+ Hinzufügen</button>
  </div>
  <template x-if="pf && pf.empty">
    <div>
      <div class="card empty-start">
        <h2>Du hast noch nichts eingetragen</h2>
        <p class="ink2">Kein Problem. Wähle, was zu dir passt:</p>
        <div class="start-opts">
          <a class="opt" href="#/start"><span class="ic">🧭</span><b>Ich will anfangen</b><span>5 Fragen, dann weißt du, wie viel du wo anlegen könntest.</span></a>
          <button class="opt" @click="openHolding()"><span class="ic">📦</span><b>Ich habe schon etwas</b><span>Goldmünze, Schmuck, ETF, Aktie oder Bitcoin eintragen.</span></button>
          <button class="opt" @click="openPlan()"><span class="ic">🔁</span><b>Ich habe einen Sparplan</b><span>Jeden Monat wird automatisch ein fester Betrag angelegt? Das Tool rechnet alle Käufe nach.</span></button>
          <a class="opt" href="#/rechner/past"><span class="ic">⏪</span><b>Erst mal ausprobieren</b><span>Was wäre aus 50 € im Monat seit 2015 geworden?</span></a>
        </div>
      </div>
      <div class="card faq section">
        <h2>Gut zu wissen</h2>
        <details><summary>Warum sollte ich eintragen, was ich habe?</summary><p>Dann siehst du jeden Tag den Wert und bekommst ihn auf Wunsch per Telegram aufs Handy. Der Ratgeber kann dann auch sagen, ob deine Mischung zu deinen Zielen passt.</p></details>
        <details><summary>Muss ich den Kaufpreis wissen?</summary><p>Nein. Ohne Kaufpreis siehst du den heutigen Wert. Kennst du das Kaufdatum, rechnet das Tool den Wert an diesem Tag aus und zeigt, wie viel du gewonnen oder verloren hast.</p></details>
        <details><summary>Wo finde ich Stückzahl, Gewicht und Feinheit?</summary><p>Bei Aktien und ETFs steht die Stückzahl in der Depot-Übersicht deiner Bank (Depot = Konto für Aktien und ETFs). Bei Gold und Silber stehen Gewicht und Feinheit meist auf der Rechnung oder als kleiner Stempel auf dem Stück, zum Beispiel „585“.</p></details>
        <details><summary>Wer sieht meine Daten?</summary><p>Nur du (in deinem Profil) und, wenn du ihn nutzt, der KI-Ratgeber. Die Daten liegen auf dem Server zu Hause.</p></details>
      </div>
    </div>
  </template>
  <template x-if="pf && !pf.empty">
  <div>
    <div class="tiles">
      <div class="tile key"><div class="label">Wert heute</div><div class="v" x-text="money(pf.total)"></div></div>
      <div class="tile"><div class="label">Bezahlt (wo bekannt)</div><div class="v" x-text="pf.cost_known ? money(pf.cost_known) : '–'"></div></div>
      <div class="tile"><div class="label">Gewinn / Verlust</div><div class="v" :class="cls(pf.gain) + '-t'" x-text="pf.gain !== null ? signMoney(pf.gain) : '–'"></div></div>
      <div class="tile"><div class="label">Letzte 7 Tage</div><div class="v" :class="cls(pf.change['7d'] && pf.change['7d'].pct) + '-t'" x-text="pf.change['7d'] ? pct(pf.change['7d'].pct) : '–'"></div></div>
    </div>
    <div class="row" style="margin-top:12px" x-show="aiVisible()"><button class="small" @click="ask('Schau dir meinen Bestand an: Ist er gut gemischt und passt er zu meinen Zielen?')">💬 Ist mein Bestand gut gemischt?</button></div>
    <div class="tabs" style="margin-top:18px">
      <button :class="pfTab === 'list' && 'sel'" @click="setPfTab('list')">Deine Anlagen</button>
      <button :class="pfTab === 'history' && 'sel'" @click="setPfTab('history')">Wie hat er sich entwickelt?</button>
    </div>

    <div x-show="pfTab === 'list'">
      <template x-for="g in groupedPositions()" :key="g.asset">
        <div class="card">
          <div class="row between"><h3 style="margin:0"><i class="dot" :style="'background:' + col(g.asset)"></i> <span x-text="g.name"></span></h3><b x-text="money(g.value)"></b></div>
          <div class="muted" style="font-size:.88rem" x-text="g.extra"></div>
          <template x-for="p in g.items" :key="p.kind + p.id">
            <div class="pos">
              <i class="bar" :style="'background:' + col(g.asset)"></i>
              <div>
                <div><b x-text="p.title"></b></div>
                <div class="muted" style="font-size:.88rem" x-text="p.sub + (p.kind === 'plan' ? '' : p.buy_date ? ' · gekauft ' + dateStr(p.buy_date) : ' · ohne Kaufdatum')"></div>
              </div>
              <div class="val">
                <div><b x-text="money(p.value)"></b></div>
                <div style="font-size:.88rem" :class="cls(p.gain) + '-t'" x-text="p.gain !== null ? signMoney(p.gain) + ' (' + pct(p.gain_pct, 0) + ')' : 'Kaufpreis fehlt'"></div>
                <div class="actions">
                  <button class="small ghost" @click="p.kind === 'plan' ? openPlan(p.id) : openHolding(p.raw)">Ändern</button>
                  <button class="small ghost" style="color:var(--bad)" @click="p.kind === 'plan' ? delPlan(p.id) : delHolding(p.id)">Löschen</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
      <div class="card section">
        <div class="row between"><h3 style="margin:0">Sparpläne</h3><button class="small" @click="openPlan()">+ Sparplan</button></div>
        <p class="ink2" style="margin-top:8px">Bei einem Sparplan legt deine Bank jeden Monat automatisch einen festen Betrag an. Das Tool rechnet jeden Kauf mit dem Kurs (Preis) von diesem Tag nach.</p>
        <template x-for="p in pf.plans" :key="p.id">
          <div class="pos">
            <i class="bar" :style="'background:' + col(p.asset)"></i>
            <div><b x-text="assetName(p.asset) + ': ' + money(p.amount, p.cur) + ' im Monat'"></b>
              <div class="muted" style="font-size:.88rem" x-text="'seit ' + dateStr(p.start) + (p.end ? ' bis ' + dateStr(p.end) : '') + ' · ' + p.executions + ' Käufe' + (p.running ? '' : ' · beendet')"></div></div>
            <div class="val"><b x-text="money(p.value)"></b><div class="muted" style="font-size:.88rem" x-text="'eingezahlt ' + money(p.invested)"></div></div>
          </div>
        </template>
        <div class="muted" x-show="!pf.plans.length">Noch kein Sparplan.</div>
      </div>
    </div>

    <div x-show="pfTab === 'history'">
      <template x-if="hist && hist.empty">
        <div class="card"><h3>Noch nichts zu sehen</h3><p class="ink2">Dafür braucht das Tool ein Kaufdatum. Trag es bei deinen Anlagen über „Ändern“ nach oder lege einen Sparplan mit Startdatum an.</p></div>
      </template>
      <template x-if="hist && !hist.empty">
        <div class="card">
          <div class="row between"><h3 style="margin:0">So hat sich dein Bestand entwickelt</h3>
            <div class="seg"><button class="small" :class="histMode === 'total' && 'sel'" @click="histMode = 'total'; drawHistory()">Gesamt</button><button class="small" :class="histMode === 'assets' && 'sel'" @click="histMode = 'assets'; drawHistory()">Nach Anlage</button></div></div>
          <ul class="sentences">
            <li x-text="'Seit ' + dateStr(hist.start) + ' hast du ' + money(hist.invested_total) + ' angelegt. Heute ist es ' + money(hist.final) + ' wert (' + pct(hist.final / hist.invested_total - 1, 0) + ').'"></li>
            <li x-text="'Größter Absturz vom Hoch: ' + pct(hist.max_dd, 0) + ' (am ' + dateStr(hist.max_dd_date) + '). So weit lag der Wert einmal unter seinem bisherigen Höchststand.'"></li>
            <li x-show="hist.skipped" x-text="hist.skipped + (hist.skipped === 1 ? ' Eintrag ohne Kaufdatum ist' : ' Einträge ohne Kaufdatum sind') + ' nicht enthalten.'"></li>
          </ul>
          <div id="ch-history" class="chart tall"></div>
          <p class="muted" style="font-size:.85rem">Einträge ohne Kaufpreis zählen mit ihrem Wert am Kaufdatum als „bezahlt“.</p>
        </div>
      </template>
    </div>
  </div>
  </template>
</section>

<!-- ---------- Ziele & Finanzprofil ---------- -->
<section x-show="route === 'ziele'">
  <div class="page-head"><h1>Ziele & Finanzprofil</h1><p>Je mehr der Ratgeber über dich weiß, desto passender werden Tipps, Rechner und KI-Antworten. Alles ist freiwillig und wird sofort gespeichert.</p></div>
  <template x-if="fin">
  <div class="grid g2" style="align-items:start">
    <div class="stack">
      <div class="card">
        <div class="row between"><h2 style="margin:0">Deine Ziele</h2><button class="small" @click="openGoal()">+ Ziel</button></div>
        <template x-if="!fin.goals.length">
          <div style="margin-top:10px"><p class="ink2">Noch kein Ziel. Ein Ziel ist ein Betrag zu einem Zeitpunkt, zum Beispiel „10.000 € fürs Auto in 4 Jahren“.</p>
            <a class="btn primary" href="#/start">Mit dem Plan-Assistenten festlegen</a></div>
        </template>
        <template x-for="g in fin.goals" :key="g.id">
          <div class="goal-row">
            <div><b x-text="g.name"></b><div class="muted" style="font-size:.88rem" x-text="purposeName(g.purpose) + (g.amount ? ' · ' + money(g.amount) : '') + (g.years ? ' in ' + num(g.years, 0) + ' Jahren' : '')"></div>
              <div style="font-size:.9rem" x-show="g.plan" x-text="g.plan ? 'Nötig: etwa ' + money(g.plan.monthly) + ' im Monat (' + g.plan.label + ')' : ''"></div></div>
            <div class="actions"><button class="small ghost" @click="openGoal(g)">Ändern</button><button class="small ghost" style="color:var(--bad)" @click="delGoal(g.id)">Löschen</button></div>
          </div>
        </template>
        <div class="notice" style="margin-top:10px" x-show="fin.goals.length && goalNeed() > 0" x-text="goalNeedText()"></div>
      </div>
      <div class="card">
        <h2>Dein Geld im Monat</h2>
        <div class="grid g2">
          <label class="f"><span class="t">Netto-Einkommen <button type="button" class="help" @click="toggleHelp('h_fin_income')">?</button></span>
            <div class="help-box" x-show="help.h_fin_income">Was nach Steuern und Sozialabgaben jeden Monat auf deinem Konto ankommt. Spart ihr als Paar gemeinsam, trag Einkommen und Ausgaben von beiden ein.</div>
            <div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.income" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Ausgaben (alles) <button type="button" class="help" @click="toggleHelp('h_fin_exp')">?</button></span>
            <div class="help-box" x-show="help.h_fin_exp">Alles, was im Monat abgeht: Miete, Strom, Versicherungen, Handy, Essen, Freizeit. Tipp: Nimm den Schnitt deiner Kontoauszüge der letzten 3 Monate. Daraus berechnet das Tool deinen Notgroschen.</div>
            <div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.expenses" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Sparrate <button type="button" class="help" @click="toggleHelp('h_fin_saving')">?</button></span>
            <div class="help-box" x-show="help.h_fin_saving">So viel legst du jeden Monat zur Seite, zum Beispiel 100 € per Sparplan oder Dauerauftrag.</div>
            <div class="suffix"><input type="number" min="0" step="25" x-model.number="finEdit.saving" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Auf Konto/Tagesgeld <button type="button" class="help" @click="toggleHelp('h_fin_cash')">?</button></span>
            <div class="help-box" x-show="help.h_fin_cash">Geld auf Girokonto, Sparbuch und Tagesgeld (Sparkonto mit Zinsen, jederzeit verfügbar). Daran misst das Tool, ob dein Notgroschen reicht.</div>
            <div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.cash" @input="saveFin()" placeholder="–"><span x-text="curSym()"></span></div></label>
          <label class="f"><span class="t">Teure Schulden <button type="button" class="help" @click="toggleHelp('h_fin_debt')">?</button></span>
            <div class="help-box" x-show="help.h_fin_debt">Minus auf dem Girokonto (Dispo), Ratenkredite und Kreditkarten-Schulden. Sie kosten meist mehr Zinsen, als eine Anlage bringt. Hauskredit und BAföG zählen nicht.</div>
            <div class="suffix"><input type="number" min="0" step="100" x-model.number="finEdit.debt" @input="saveFin()" placeholder="0"><span x-text="curSym()"></span></div></label>
        </div>
        <ul class="sentences" style="margin-top:0">
          <li x-show="fin.free !== null" x-text="'Frei im Monat: ' + money(fin.free) + (finEdit.income ? ' (' + num(fin.free / finEdit.income * 100, 0) + ' % vom Netto-Einkommen).' : '.')"></li>
          <li x-show="fin.emergency" x-text="'Notgroschen-Ziel (3 Monatsausgaben): ' + money(fin.emergency) + ((finEdit.cash || 0) >= fin.emergency ? ' – erreicht ✓' : ' – es fehlen ' + money(fin.emergency - (finEdit.cash || 0)) + '.')"></li>
        </ul>
        <a class="more" href="#/rechner/budget">Sparrate genauer ausrechnen →</a>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <h2>Du und Risiko</h2>
        <span class="t" style="font-weight:600;font-size:.93rem;display:block;margin-bottom:6px">Wie viel Schwankung hältst du aus? <button type="button" class="help" @click="toggleHelp('h_risk')">?</button></span>
        <div class="help-box" x-show="help.h_risk">Schwankung heißt: Der Wert geht mal hoch, mal runter. Frag dich, ob du ruhig bleibst, wenn aus 10.000 € für ein paar Monate 7.000 € werden. „Sehr mutig“ heißt starkes Auf und Ab für mehr mögliches Wachstum, „sehr vorsichtig“ kaum Auf und Ab.</div>
        <div class="risk-pick"><template x-for="r in riskLevels" :key="r[0]"><button :class="finEdit.risk === r[0] && 'sel'" @click="finEdit.risk = r[0]; saveFin()"><b x-text="r[0]"></b><small x-text="r[1]"></small></button></template></div>
        <div class="hint" x-text="riskText(finEdit.risk)"></div>
        <div class="grid g2" style="margin-top:12px">
          <label class="f"><span class="t">Erfahrung mit Geldanlage</span><select x-model="finEdit.experience" @change="saveFin()"><option value="">–</option><option value="none">keine</option><option value="some">etwas</option><option value="much">viel</option></select></label>
          <label class="f"><span class="t">Alter</span><input type="number" min="14" max="110" x-model.number="finEdit.age" @input="saveFin()" placeholder="–"></label>
        </div>
      </div>
      <div class="card">
        <h2>Steuern</h2>
        <label class="check"><input type="checkbox" x-model="finEdit.married" @change="saveFin()"><span>Verheiratet, gemeinsame Steuererklärung <span class="muted">(steuerfreier Gewinn 2.000 € statt 1.000 € im Jahr)</span></span></label>
        <label class="f"><span class="t">Kirchensteuer <button type="button" class="help" @click="toggleHelp('h_church')">?</button></span>
          <div class="help-box" x-show="help.h_church">Bist du Mitglied einer Kirche, zahlst du auch auf Gewinne aus Geldanlagen Kirchensteuer. Die Höhe hängt vom Bundesland ab. Auf deiner Lohnabrechnung steht sie als „KiSt“.</div>
          <select x-model="finEdit.church" @change="saveFin()"><option value="none">keine</option><option value="8">8 % (Bayern, Baden-Württemberg)</option><option value="9">9 % (andere Länder)</option></select></label>
        <label class="f"><span class="t">Zu versteuerndes Einkommen im Jahr <button type="button" class="help" @click="toggleHelp('h_zve')">?</button></span>
          <div class="help-box" x-show="help.h_zve">Dein Jahreseinkommen nach allen Abzügen, auf das das Finanzamt die Steuer berechnet. Es steht in deinem letzten Steuerbescheid. Daraus rechnet das Tool deinen persönlichen Steuersatz aus.</div>
          <div class="suffix"><input type="number" min="0" step="1000" x-model.number="finEdit.zve" @input="saveFin()" placeholder="steht im Steuerbescheid"><span x-text="curSym()"></span></div>
          <div class="hint">Weißt du nicht? <a href="#/rechner/taxrate">Aus dem Bruttogehalt schätzen →</a></div></label>
        <div class="ok-box" x-show="fin.personal_rate_auto" x-text="'Dein persönlicher Steuersatz: ' + num(fin.personal_rate * 100, 1) + ' %. So viel Steuer zahlst du auf jeden zusätzlichen Euro, etwa für Gold, Silber und Krypto, die du innerhalb eines Jahres wieder verkaufst. Freibetrag (steuerfreier Gewinn im Jahr): ' + money(fin.allowance) + '.'"></div>
      </div>
      <div class="card">
        <h2>Notizen für den Ratgeber</h2>
        <textarea rows="3" maxlength="1500" x-model="finEdit.notes" @input="saveFin()" placeholder="z. B. Ich bin selbstständig, plane in 2 Jahren eine Weltreise …"></textarea>
        <div class="hint">Der KI-Ratgeber liest das mit und kann hier auch selbst Dinge eintragen, die du ihm erzählst.</div>
      </div>
    </div>
  </div>
  </template>
</section>

<!-- ---------- Rechner ---------- -->
<section x-show="route === 'rechner'">
  <template x-if="!calcId">
    <div>
      <div class="page-head"><h1>Rechner</h1><p>Wähle eine Frage. Rechner mit „echte Kurse“ spielen tausende mögliche Zukünfte aus vergangenen Kursen durch, die anderen rechnen mit Werten, die du selbst einstellst.</p></div>
      <template x-for="cat in calcCats" :key="cat.id">
        <div class="section" x-show="calcsIn(cat.id).length">
          <h2 x-text="cat.label"></h2>
          <div class="calc-grid">
            <template x-for="c in calcsIn(cat.id)" :key="c.id">
              <a class="card calc-card" :href="'#/rechner/' + c.id"><span class="ic" x-text="c.icon"></span><b x-text="c.title"></b><small x-text="c.question"></small><span class="tag" x-show="c.ui === 'custom'">echte Kurse</span></a>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="calcId && calcDef">
    <div>
      <a href="#/rechner" class="back">← Alle Rechner</a>
      <div class="page-head"><h1><span x-text="calcDef.icon"></span> <span x-text="calcDef.title"></span></h1><p x-text="calcDef.question"></p></div>

      <!-- generische Rechner -->
      <template x-if="calcDef.ui === 'generic'">
        <div class="calc">
          <div class="card inputs">
            <template x-for="f in calcDef.fields" :key="f.key">
              <div x-show="fieldVisible(f)">
                <template x-if="['money', 'number', 'percent', 'years'].includes(f.type)">
                  <label class="f"><span class="t"><span x-text="f.label"></span><button type="button" class="help" x-show="f.help" @click.prevent="toggleHelp(calcId + f.key)">?</button></span>
                    <div class="help-box" x-show="help[calcId + f.key]" x-text="f.help"></div>
                    <div class="suffix"><input type="number" :min="f.min" :max="f.max" :step="f.step || (f.type === 'money' ? 'any' : 1)" x-model.number="gv[f.key]" @input="recalcG()"><span x-text="fieldSuffix(f)"></span></div></label>
                </template>
                <template x-if="f.type === 'select'">
                  <label class="f"><span class="t"><span x-text="f.label"></span><button type="button" class="help" x-show="f.help" @click.prevent="toggleHelp(calcId + f.key)">?</button></span>
                    <div class="help-box" x-show="help[calcId + f.key]" x-text="f.help"></div>
                    <select x-model="gv[f.key]" @change="recalcG()"><template x-for="o in f.options" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] == gv[f.key]"></option></template></select></label>
                </template>
                <template x-if="f.type === 'toggle'">
                  <label class="check"><input type="checkbox" x-model="gv[f.key]" @change="recalcG()"><span x-text="f.label"></span></label>
                </template>
                <template x-if="f.type === 'market'">
                  <label class="f"><span class="t" x-text="f.label"></span>
                    <select x-model="gv[f.key]" @change="recalcG()"><template x-for="k in marketGroups()" :key="k.id"><optgroup :label="k.label"><template x-for="a in k.items" :key="a"><option :value="a" x-text="assetName(a)" :selected="a === gv[f.key]"></option></template></optgroup></template></select></label>
                </template>
                <template x-if="f.type === 'date'">
                  <label class="f"><span class="t" x-text="f.label"></span><input type="date" x-model="gv[f.key]" @change="recalcG()"></label>
                </template>
              </div>
            </template>
          </div>
          <div>
            <div class="err" x-show="calcErr" x-text="calcErr"></div>
            <div class="busy" x-show="busy">Rechnet …</div>
            <template x-if="gres">
              <div class="card">
                <div class="tiles" :class="'t' + Math.min((gres.tiles || []).length, 4)" x-show="gres.tiles && gres.tiles.length">
                  <template x-for="t in gres.tiles" :key="t.label"><div class="tile" :class="t.tone === 'accent' && 'key'"><div class="label" x-text="t.label"></div><div class="v" :class="t.tone === 'good' ? 'up-t' : t.tone === 'bad' ? 'down-t' : ''" x-text="t.value"></div><small x-show="t.note" x-text="t.note"></small></div></template>
                </div>
                <ul class="sentences"><template x-for="t in gres.text || []"><li x-text="t"></li></template></ul>
                <template x-for="(c, i) in gres.charts || []" :key="i">
                  <div class="section"><h3 x-text="c.title"></h3><div :id="'ch-g' + i" class="chart" :class="c.type === 'hbar' ? 'small' : ''"></div><p class="muted" style="font-size:.85rem" x-show="c.note" x-text="c.note"></p></div>
                </template>
                <template x-if="gres.table">
                  <details class="section" :open="!(gres.charts || []).length"><summary style="cursor:pointer;font-weight:600" x-text="gres.table.title || 'Tabelle'"></summary>
                    <div class="table-wrap"><table class="t"><thead><tr><template x-for="h in gres.table.head"><th x-text="h"></th></template></tr></thead>
                      <tbody><template x-for="(r, ri) in gres.table.rows" :key="ri"><tr><template x-for="(v, ci) in r" :key="ci"><td x-text="v"></td></template></tr></template></tbody></table></div>
                  </details>
                </template>
                <div class="row section" x-show="(gres.actions || []).length || aiVisible()">
                  <template x-for="a in gres.actions || []" :key="a.label"><button :class="a.type === 'save_finance' ? 'primary small' : 'small'" @click="calcAction(a)" x-text="a.label"></button></template>
                  <button class="small" x-show="aiVisible()" @click="ask('Erklär mir bitte dieses Ergebnis in einfachen Worten und was es für mich bedeutet.')">💬 Erklär mir das</button>
                </div>
                <p class="muted" style="font-size:.82rem;margin-top:12px"><template x-for="n in gres.notes || []"><span x-text="n + ' '"></span></template></p>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Simulationen mit echten Kursen -->
      <template x-if="calcDef.ui === 'custom'">
      <div class="calc">
        <div class="card inputs">
          <template x-if="calc.q === 'goal'">
            <label class="f"><span class="t">Zielbetrag <button type="button" class="help" @click="toggleHelp('goal')">?</button></span>
              <div class="help-box" x-show="help.goal">Wie viel möchtest du am Ende haben? Zum Beispiel für ein Auto, eine Wohnung oder als Rücklage.</div>
              <div class="suffix"><input type="number" min="0" step="1000" x-model.number="calc.goal" @input="recalc()"><span x-text="curSym()"></span></div></label>
          </template>
          <label class="f"><span class="t">Startbetrag <button type="button" class="help" @click="toggleHelp('initial')">?</button></span>
            <div class="help-box" x-show="help.initial">Geld, das du am Anfang auf einmal anlegst, zum Beispiel 1.000 € vom Sparbuch. Trag 0 ein, wenn du nur monatlich sparst.</div>
            <div class="suffix"><input type="number" min="0" step="100" x-model.number="calc.initial" @input="recalc()"><span x-text="curSym()"></span></div></label>
          <template x-if="calc.q !== 'past' && pfTotal() > 0">
            <label class="check"><input type="checkbox" x-model="calc.use_holdings" @change="recalc()"><span>Meinen Bestand dazunehmen <span class="muted" x-text="'(' + money(pfTotal()) + ')'"></span></span></label>
          </template>
          <template x-if="calc.q !== 'goal'">
            <label class="f"><span class="t">Sparrate pro Monat <button type="button" class="help" @click="toggleHelp('monthly')">?</button></span>
              <div class="help-box" x-show="help.monthly">Betrag, den du jeden Monat anlegst, zum Beispiel 100 €. Weil du jeden Monat kaufst, erwischst du mal teure, mal günstige Kurse und musst keinen Zeitpunkt abpassen.</div>
              <div class="suffix"><input type="number" min="0" step="25" x-model.number="calc.monthly" @input="recalc()"><span x-text="curSym()"></span></div></label>
          </template>
          <template x-if="calc.q !== 'past'">
            <label class="f"><span class="t">Laufzeit: <span x-text="calc.years + ' Jahre'"></span> <button type="button" class="help" @click="toggleHelp('years')">?</button></span>
              <div class="help-box" x-show="help.years">Wie lange du das Geld liegen lässt. Je länger, desto eher gleichen sich Schwankungen aus, eine Garantie gibt es aber nie.</div>
              <input type="range" min="1" max="40" x-model.number="calc.years" @input="recalc()"></label>
          </template>
          <template x-if="calc.q === 'past'">
            <label class="f"><span class="t">Start <button type="button" class="help" @click="toggleHelp('start')">?</button></span>
              <div class="help-box" x-show="help.start">Ab wann hättest du angelegt? Das Tool rechnet mit echten Kursen bis heute. Preise in Dollar rechnet es mit dem damaligen Wechselkurs in deine Währung um.</div>
              <input type="month" x-model="calc.start" @change="recalc()" min="2000-01">
              <div class="seg" style="margin-top:6px"><template x-for="y in [1, 3, 5, 10, 20]" :key="y"><button type="button" class="small" @click="calc.start = yearsAgo(y); recalc()" x-text="'vor ' + y + ' J.'"></button></template></div></label>
          </template>

          <div class="f weights">
            <div class="row between" style="margin-bottom:8px"><span style="font-weight:600;font-size:.93rem">Worin? <button type="button" class="help" @click="toggleHelp('weights')">?</button></span><small x-show="wSum() !== 100 && wSum() > 0" x-text="'Summe ' + wSum() + ' %, wird auf 100 % umgerechnet'"></small></div>
            <div class="help-box" x-show="help.weights">Wer streut, also auf mehrere Anlagen verteilt, erlebt meist kleinere Abstürze. Über „+ Anlage hinzufügen“ nimmst du jeden Markt dazu. „Anleihen“ sind Kredite an Staaten mit festen Zinsen, sie schwanken weniger als Aktien.</div>
            <template x-for="a in wKeys()" :key="a">
              <div class="w-row"><b :title="assetName(a)"><i class="dot" :style="'background:' + col(a)"></i><span x-text="shortName(a)"></span></b>
                <input type="range" min="0" max="100" step="5" x-model.number="calc.weights[a]" @input="recalc()"><output x-text="calc.weights[a] + ' %'"></output>
                <button type="button" class="x" @click="wRemove(a)" title="Entfernen">×</button></div>
            </template>
            <select class="add-sel" @change="wAdd($event.target.value); $event.target.value = ''">
              <option value="">+ Anlage hinzufügen …</option>
              <template x-for="k in marketGroups()" :key="k.id"><optgroup :label="k.label"><template x-for="a in k.items.filter((x) => !(x in calc.weights))" :key="a"><option :value="a" x-text="assetName(a)"></option></template></optgroup></template>
            </select>
            <div class="seg" style="margin-top:8px">
              <button type="button" class="small" @click="preset({MSCIW: 100})">Nur Welt-ETF</button>
              <button type="button" class="small" @click="preset({MSCIW: 70, EUGOV: 30})">ETF + Anleihen</button>
              <button type="button" class="small" @click="preset({MSCIW: 80, GOLD: 20})">ETF + Gold</button>
              <button type="button" class="small" @click="presetWatch()">Meine Märkte gleich verteilt</button>
            </div>
          </div>

          <details class="adv">
            <summary>Erweitert: Annahmen, Kosten, Steuern</summary>
            <template x-if="calc.q !== 'past'">
              <label class="f"><span class="t">Angenommenes Wachstum <button type="button" class="help" @click="toggleHelp('drift')">?</button></span>
                <div class="help-box" x-show="help.drift">„Vorsichtig“ rechnet mit weniger Wachstum als in der Vergangenheit, bei Bitcoin höchstens 15 % im Jahr. „Wie in der Vergangenheit“ nimmt den alten Durchschnitt, das ist bei Bitcoin sehr optimistisch. „Ohne Wachstum“ zeigt nur das Auf und Ab.</div>
                <select x-model="calc.drift" @change="recalc()"><option value="careful">Vorsichtig (empfohlen)</option><option value="historic">Wie in der Vergangenheit</option><option value="none">Ohne Wachstum, nur Schwankung</option></select></label>
            </template>
            <label class="check"><input type="checkbox" x-model="calc.costs" @change="recalc()"><span>Kosten berücksichtigen <span class="muted">(Gebühren, Preisabschlag beim Verkauf, laufende Kosten)</span></span></label>
            <label class="check" x-show="calc.q !== 'goal'"><input type="checkbox" x-model="calc.tax" @change="recalc()"><span>Steuern berücksichtigen <span class="muted" x-text="'(' + taxName() + ')'"></span></span></label>
            <label class="check" x-show="calc.q === 'future'"><input type="checkbox" x-model="calc.inflation" @change="recalc()"><span>In heutigem Geld zeigen <span class="muted">(Preissteigerung herausgerechnet)</span></span></label>
            <label class="f" x-show="calc.q !== 'goal'" style="margin-top:8px"><span class="t">Umschichten <button type="button" class="help" @click="toggleHelp('rebalance')">?</button></span>
              <div class="help-box" x-show="help.rebalance">Mit der Zeit verschiebt sich deine Mischung, weil eine Anlage stärker steigt als die andere. Beim Umschichten verkauft das Tool etwas vom Gewinner und kauft vom Rest nach, bis die geplante Mischung wieder stimmt.</div>
              <select x-model="calc.rebalance" @change="recalc()"><option value="none">Nie</option><option value="yearly">Einmal im Jahr</option><option value="quarterly">Alle 3 Monate</option></select></label>
            <template x-if="calc.q === 'future'">
              <label class="f"><span class="t">Später monatlich entnehmen <button type="button" class="help" @click="toggleHelp('withdraw')">?</button></span>
                <div class="help-box" x-show="help.withdraw">Zum Beispiel als Zusatzrente. Erstes Feld: wie viel du jeden Monat herausnimmst. Zweites Feld: ab welchem Jahr.</div>
                <div class="grid g2"><div class="suffix"><input type="number" min="0" step="50" x-model.number="calc.wd_monthly" @input="recalc()"><span x-text="curSym()"></span></div>
                  <div class="suffix"><input type="number" min="1" max="40" x-model.number="calc.wd_from" @input="recalc()"><span>Jahr</span></div></div></label>
            </template>
          </details>
        </div>

        <div>
          <div class="err" x-show="calcErr" x-text="calcErr"></div>
          <div class="busy" x-show="busy">Rechnet …</div>
          <template x-if="res && res.q === 'future' && calc.q === 'future'">
            <div class="card">
              <div class="tiles">
                <div class="tile"><div class="label">Eingezahlt</div><div class="v" x-text="money(res.invested)"></div></div>
                <div class="tile key"><div class="label" x-text="'Mittlerer Verlauf' + (res.net_label ? ' (' + res.net_label + ')' : '')"></div><div class="v" x-text="money(res.end['50'])"></div></div>
                <div class="tile"><div class="label">Schlechter Verlauf (1 von 20)</div><div class="v" x-text="money(res.end['5'])"></div></div>
                <div class="tile"><div class="label">Risiko für Verlust</div><div class="v" x-text="num(res.p_loss * 100, 0) + ' %'"></div></div>
              </div>
              <ul class="sentences"><template x-for="t in res.text"><li x-text="t"></li></template></ul>
              <div class="row between section" style="margin-top:18px">
                <h3 style="margin:0" x-text="'Dein Geld in ' + res.years + ' Jahren'"></h3>
                <div class="seg"><button class="small" :class="futView === 'fan' && 'sel'" @click="futView = 'fan'; drawCalc()">Spanne</button><button class="small" :class="futView === 'bars' && 'sel'" @click="futView = 'bars'; drawCalc()">Jahresbalken</button></div>
              </div>
              <div id="ch-calc" class="chart tall"></div>
              <p class="muted" style="font-size:.85rem" x-show="futView === 'fan'" x-text="fanNote + (res.net_label ? ' Das Diagramm zeigt den Wert vor dem Verkauf.' : '')"></p>
              <p class="muted" style="font-size:.85rem" x-show="futView === 'bars'">Balken = mittlerer Verlauf. Grau ist, was du eingezahlt hast, violett der Wertzuwachs.</p>
              <template x-if="res.stress"><div class="notice" style="margin-top:12px"><b>Härtetest:</b> <span x-text="stressText()"></span></div></template>
              <template x-if="res.ran_out_share !== null && res.ran_out_share !== undefined">
                <div class="notice" style="margin-top:12px" x-text="'Entnahme: In ' + num(res.ran_out_share * 100, 0) + ' % der Verläufe ist das Geld vor dem Ende aufgebraucht.'"></div>
              </template>
              <div class="row section" x-show="aiVisible()"><button class="small" @click="ask('Erklär mir bitte dieses Ergebnis in einfachen Worten: Was heißt die Spanne, und ist die Mischung für mich sinnvoll?')">💬 Erklär mir das</button></div>
              <details class="section"><summary style="cursor:pointer;font-weight:600">Jahr für Jahr</summary>
                <div class="table-wrap"><table class="t"><thead><tr><th>Jahr</th><th>Eingezahlt</th><th>Schlecht (1 von 20)</th><th>Mittel</th><th>Gut (1 von 20)</th></tr></thead>
                  <tbody><template x-for="r in res.rows" :key="r.year"><tr><td x-text="r.year"></td><td x-text="money(r.invested)"></td><td x-text="money(r.p5)"></td><td><b x-text="money(r.p50)"></b></td><td x-text="money(r.p95)"></td></tr></template></tbody></table></div>
              </details>
              <p class="muted" style="font-size:.82rem;margin-top:12px" x-text="assumptionText()"></p>
            </div>
          </template>
          <template x-if="res && res.q === 'goal' && calc.q === 'goal'">
            <div class="card">
              <div class="tiles">
                <div class="tile key"><div class="label">Mittlerer Verlauf</div><div class="v" x-text="money(res.monthly_50) + ' /Monat'"></div></div>
                <div class="tile"><div class="label">Sicherer (3 von 4)</div><div class="v" x-text="money(res.monthly_75) + ' /Monat'"></div></div>
                <div class="tile"><div class="label">Sehr sicher (9 von 10)</div><div class="v" x-text="money(res.monthly_90) + ' /Monat'"></div></div>
                <div class="tile"><div class="label">Ohne Anlage</div><div class="v" x-text="money(res.no_risk) + ' /Monat'"></div></div>
              </div>
              <ul class="sentences"><template x-for="t in res.text"><li x-text="t"></li></template></ul>
              <p class="ink2 section">„3 von 4“ heißt: Mit dieser Rate erreichst du dein Ziel in 3 von 4 durchgespielten Verläufen. Tipp: Nimm die Rate aus „Mittlerer Verlauf“ und prüfe sie unter <a :href="goalToFutureLink()">„Was könnte daraus werden?“</a>, dann siehst du die ganze Spanne.</p>
              <div class="row" x-show="aiVisible()"><button class="small" @click="ask('Erklär mir bitte dieses Ergebnis: Welche Sparrate sollte ich wählen?')">💬 Erklär mir das</button></div>
              <p class="muted" style="font-size:.82rem" x-text="'Annahmen: Wachstum ' + res.assumptions.drift + ', ' + (res.assumptions.costs ? 'mit Kosten' : 'ohne Kosten') + ', vor Steuern, ' + res.assumptions.n_sims + ' durchgespielte Verläufe aus echten Kursen seit ' + dateStr(res.assumptions.history_from) + '.'"></p>
            </div>
          </template>
          <template x-if="res && res.q === 'past' && calc.q === 'past'">
            <div class="card">
              <template x-for="n in res.notes"><div class="notice" style="margin-bottom:10px" x-text="n"></div></template>
              <div class="tiles">
                <div class="tile"><div class="label">Eingezahlt</div><div class="v" x-text="money(res.invested)"></div></div>
                <div class="tile key"><div class="label" x-text="'Wert heute' + (res.net_label ? ' (' + res.net_label + ')' : '')"></div><div class="v" x-text="money(res.final)"></div></div>
                <div class="tile"><div class="label">Gewinn / Verlust</div><div class="v" :class="cls(res.final - res.invested) + '-t'" x-text="signMoney(res.final - res.invested)"></div></div>
                <div class="tile"><div class="label">Größter Absturz vom Hoch</div><div class="v down-t" x-text="pct(res.max_dd, 0)"></div></div>
              </div>
              <ul class="sentences"><template x-for="t in res.text"><li x-text="t"></li></template></ul>
              <h3 class="section">So hat sich der Wert entwickelt</h3>
              <div id="ch-calc" class="chart tall"></div>
              <p class="muted" style="font-size:.85rem" x-show="res.net_label">Das Diagramm zeigt den Wert vor dem Verkauf, die Kacheln oben, was <span x-text="res.net_label"></span> übrig bleibt.</p>
              <h3 class="section">Zum Vergleich: alles in eine Anlage</h3>
              <p class="ink2" style="font-size:.93rem">Gleiche Einzahlungen, gleicher Zeitraum.</p>
              <div id="ch-compare" class="chart small"></div>
              <div class="row section" x-show="aiVisible()"><button class="small" @click="ask('Erklär mir bitte dieses Ergebnis: Was lerne ich daraus für die Zukunft?')">💬 Erklär mir das</button></div>
              <details class="section"><summary style="cursor:pointer;font-weight:600">Jahr für Jahr</summary>
                <div class="table-wrap"><table class="t"><thead><tr><th>Zeitpunkt</th><th>Eingezahlt</th><th>Wert</th><th>Gewinn</th></tr></thead>
                  <tbody><template x-for="r in res.rows" :key="r.date"><tr><td x-text="r.label"></td><td x-text="money(r.invested)"></td><td><b x-text="money(r.value)"></b></td><td :class="cls(r.value - r.invested) + '-t'" x-text="signMoney(r.value - r.invested)"></td></tr></template></tbody></table></div>
              </details>
              <p class="muted" style="font-size:.82rem;margin-top:12px" x-text="'Annahmen: ' + (res.assumptions.costs ? 'mit Kosten' : 'ohne Kosten') + ', ' + res.assumptions.tax + (res.assumptions.fx ? ', mit echten Wechselkursen' : '') + '. Gekauft wird jeweils zum letzten Kurs des Tages.'"></p>
            </div>
          </template>
        </div>
      </div>
      </template>

      <div class="section card faq" x-show="calcDef.ui === 'custom'">
        <h2>So funktioniert der Rechner</h2>
        <details><summary>Woher kommen die Zahlen für die Zukunft?</summary><p>Das Tool spielt einige tausend mögliche Zukünfte durch. Dafür schneidet es die echten Kurse der Vergangenheit in Stücke von je 20 Börsentagen (etwa ein Monat) und setzt sie zufällig neu zusammen, für alle Anlagen mit denselben Tagen. So stecken echte Krisen und Erholungen drin, und was früher gemeinsam fiel, fällt auch hier gemeinsam.</p></details>
        <details><summary>Was heißen „mittlerer Verlauf“ und „1 von 20“?</summary><p>Stell dir alle durchgespielten Verläufe sortiert vor, vom schlechtesten bis zum besten. Der mittlere Verlauf steht genau in der Mitte: Die Hälfte lief besser, die Hälfte schlechter. „Schlechter Verlauf (1 von 20)“ heißt: Nur jeder zwanzigste Verlauf endete noch schlechter.</p></details>
        <details><summary>Stimmen diese Spannen?</summary><p>Das Tool prüft sich jede Nacht selbst. Es tut so, als stünde es an einem Tag in der Vergangenheit, rechnet die Spanne aus und vergleicht sie mit dem, was danach wirklich passiert ist. Die Ergebnisse zeigt die Seite <a href="#/methodik">„Wie rechnet das Tool?“</a>.</p></details>
        <details><summary>Kann das Tool sagen, ob es morgen hoch oder runter geht?</summary><p>Nein. Das Tool hat mehrere Rechenmodelle getestet, keines sagte die Richtung nach Abzug der Gebühren besser voraus als die einfache Annahme „steigt langfristig“. Deshalb zeigt es Spannen statt fester Zielpreise.</p></details>
      </div>
    </div>
  </template>
</section>

<!-- ---------- Märkte: Liste ---------- -->
<section x-show="route === 'maerkte' && !mkAsset">
  <div class="page-head"><h1>Märkte</h1><p>Hier findest du jede Anlage mit ihrem aktuellen Kurs (Preis): Gold, Aktien, ETFs, Bitcoin und mehr. Mit dem Stern ☆ kommt sie auf deinen Überblick und in deinen Bericht.</p></div>
  <div class="mk-tools">
    <input type="search" placeholder="Suchen: Name oder Kürzel" x-model="mkq" @input="mkSearchClear()">
    <div class="tabs" style="margin:0"><button class="small" :class="mkKind === '' && 'sel'" @click="mkKind = ''">Alle</button>
      <button class="small" :class="mkKind === 'watch' && 'sel'" @click="mkKind = 'watch'">☆ Meine</button>
      <template x-for="k in mkKinds" :key="k.id"><button class="small" :class="mkKind === k.id && 'sel'" @click="mkKind = k.id" x-text="k.label" x-show="mkCount(k.id)"></button></template></div>
  </div>
  <div class="card list" style="margin-top:12px">
    <template x-for="m in mkFiltered()" :key="m.id">
      <div class="mrow">
        <button class="star" :class="m.watched && 'on'" @click="toggleWatch(m)" :title="m.watched ? 'Nicht mehr beobachten' : 'Beobachten'" x-text="m.watched ? '★' : '☆'"></button>
        <a class="mrow-main" :href="'#/maerkte/' + m.id"><b x-text="m.name"></b><small x-text="m.kind_label + ' · ' + m.desc"></small></a>
        <a class="mrow-price" :href="'#/maerkte/' + m.id"><b x-text="m.price"></b><small x-text="m.label"></small></a>
        <div class="mrow-ch"><span class="chip" :class="cls(m.change['7d'])" x-text="pct(m.change['7d'])"></span></div>
      </div>
    </template>
    <div class="muted" style="padding:12px 0" x-show="mkAll && !mkFiltered().length">Nichts gefunden.</div>
  </div>
  <div class="card section">
    <h3>Nicht dabei?</h3>
    <p class="ink2" style="font-size:.93rem">Such nach jeder Aktie, jedem ETF, Fonds oder Coin (digitales Geld wie Bitcoin). Am genauesten triffst du mit der ISIN, der 12-stelligen Kennnummer auf deinen Bank-Unterlagen. Das Tool lädt dann alle früheren Kurse.</p>
    <form class="row" @submit.prevent="mkSearch()"><input type="search" x-model="mkq2" placeholder="z. B. Vanguard, Novo Nordisk, IE00B4L5Y983" style="flex:1;min-width:200px"><button class="primary" type="submit" :disabled="mkBusy">Suchen</button></form>
    <div class="busy" x-show="mkBusy" x-text="mkBusyText"></div>
    <template x-for="r in mkResults" :key="r.symbol">
      <div class="mrow">
        <span class="kind-tag" x-text="r.kind_label"></span>
        <div class="mrow-main"><b x-text="r.name"></b><small x-text="r.symbol + (r.exchange ? ' · ' + r.exchange : '')"></small></div>
        <div><a class="btn small" x-show="r.known" :href="'#/maerkte/' + r.id">Öffnen</a><button class="small primary" x-show="!r.known" :disabled="mkBusy" @click="mkAdd(r)">Hinzufügen</button></div>
      </div>
    </template>
    <div class="muted" x-show="mkSearched && !mkResults.length && !mkBusy">Keine Treffer. Tipp: Versuch das Kürzel mit Börsen-Endung, z. B. „SAP.DE“ für SAP in Deutschland.</div>
  </div>
</section>

<!-- ---------- Märkte: einzelner Markt ---------- -->
<section x-show="route === 'maerkte' && mkAsset">
  <a href="#/maerkte" class="back">← Alle Märkte</a>
  <template x-if="mk">
  <div>
    <div class="page-head row between" style="align-items:flex-start">
      <div><h1 x-text="mk.name"></h1><p x-text="mkInfo().desc"></p>
        <small class="muted" x-text="mkInfo().kind_label + (mkInfo().isin ? ' · ISIN ' + mkInfo().isin : '') + ' · ' + mkInfo().symbol"></small></div>
      <div class="row"><button class="small" :class="isWatched(mk.asset) && 'sel'" @click="toggleWatch({ id: mk.asset, watched: isWatched(mk.asset) })" x-text="isWatched(mk.asset) ? '★ Beobachtet' : '☆ Beobachten'"></button>
        <button class="small" x-show="aiVisible()" @click="ask('Erklär mir ' + mk.name + ' in einfachen Worten: Was ist das, wie riskant ist es, und passt es zu mir?')">💬 Erklär mir das</button></div>
    </div>
    <div class="card">
      <div class="row between" style="align-items:flex-end">
        <div><div class="label" x-text="mk.label"></div><div class="big" x-text="mk.price.text"></div>
          <div class="row" style="margin-top:8px;gap:6px"><template x-for="k in ['24h','7d','30d','1y','5y']" :key="k"><span class="chip" :class="cls(mk.price.change[k])" x-show="mk.price.change[k] !== undefined && mk.price.change[k] !== null" x-text="periodName(k) + ' ' + pct(mk.price.change[k])"></span></template></div></div>
        <div class="seg"><template x-for="r in ranges" :key="r[0]"><button class="small" :class="mkRange === r[0] && 'sel'" @click="mkRange = r[0]; loadMarket()" x-text="r[1]"></button></template></div>
      </div>
      <div id="ch-market" class="chart tall" style="margin-top:10px"></div>
      <div class="row between"><label class="check" x-show="mk.ma200"><input type="checkbox" x-model="showMa" @change="drawMarket()"><span>200-Tage-Linie zeigen <span class="muted">(Durchschnittskurs der letzten 200 Tage, zeigt die grobe Richtung)</span></span></label>
        <small x-text="'Im Zeitraum: ' + pct(mk.change) + ' · Hoch ' + money(mk.high) + ' · Tief ' + money(mk.low)"></small></div>
    </div>
    <div class="grid g2 section">
      <div class="card"><h3>In einfachen Worten</h3><ul class="sentences" style="margin-top:4px"><template x-for="s in mk.story"><li x-text="s"></li></template></ul>
